openapi: 3.0.3
info:
  title: PaySplit Backend API
  version: 0.1.0
paths:
  /health:
    get:
      responses:
        "200":
          description: Service is healthy
  /api/v1/auth/register:
    post:
      responses:
        "201":
          description: User registered
  /api/v1/auth/login:
    post:
      responses:
        "200":
          description: User authenticated
