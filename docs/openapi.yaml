                        properties:
                          message: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/bills:
    post:
      summary: Create a manual or image-based bill draft
      operationId: createBill
      tags: [Bills]
      security: [{bearerAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string}
          description: Optional client-generated key. A repeated key with the same request body replays the original response (200/201/202); a repeated key with a different body returns 409 IDEMPOTENCY_KEY_REUSED; a key still processing returns 409 IDEMPOTENCY_IN_PROGRESS.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [group_id]
              properties:
                group_id: {type: string, format: uuid}
                merchant_name: {type: string}
                images:
                  type: array
                  items: {type: string, format: binary}
                  maxItems: 5
                metadata: {type: string, description: "JSON encoded CreateBillRequest"}
          application/json:
            schema:
              type: object
              required: [group_id, total]
              properties:
                group_id: {type: string, format: uuid}
                merchant_name: {type: string}
                bill_date: {type: string, format: date-time}
                subtotal: {type: integer, format: int64}
                service_charge: {type: integer, format: int64}
                vat: {type: integer, format: int64}
                discount: {type: integer, format: int64}
                total: {type: integer, format: int64}
                split_method: {type: string, enum: [even, item_ratio, exact, shares, percentage]}
                replaces_bill_id: {type: string, format: uuid}
                items:
                  type: array
                  items:
                    type: object
                    required: [name, line_total]
                    properties:
                      name: {type: string}
                      quantity: {type: string}
                      unit_price: {type: integer, format: int64}
                      line_total: {type: integer, format: int64}
                      discount_amount: {type: integer, format: int64, description: "Khuyến mãi riêng cho món này (VND), mặc định 0. Máy chủ tự tính lại final_price, không nhận trực tiếp từ client."}
                      assignments:
                        type: array
                        items:
                          type: object
                          required: [member_id]
                          properties:
                            member_id: {type: string, format: uuid}
                            weight: {type: string}
      responses:
        "201":
          description: Manual bill created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          bill: {$ref: "#/components/schemas/Bill"}
                          is_accepted: {type: boolean}
        "202":
          description: Image bill created and OCR job queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          bill: {$ref: "#/components/schemas/Bill"}
                          ocr_job: {$ref: "#/components/schemas/OCRJob"}
                          is_accepted: {type: boolean}
        "400":
          description: "Validation failed (VALIDATION_FAILED), or images required for an image-based draft (IMAGES_REQUIRED)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: "Idempotency-Key reused with a different request body (IDEMPOTENCY_KEY_REUSED), the same key is still being processed (IDEMPOTENCY_IN_PROGRESS), or the group's bill submission is locked so no new bill may be created (BILL_SUBMISSION_LOCKED)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    get:
      summary: List bills in a group with cursor pagination
      operationId: listBills
      tags: [Bills]
      security: [{bearerAuth: []}]
      parameters:
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: status
          in: query
          required: false
          description: >-
            Filter by bill status. Repeat the param (?status=draft&status=reviewed)
            or pass a comma separated list (?status=draft,reviewed). Omit for all
            statuses. An unknown value returns 400 VALIDATION_FAILED. Not supported
            together with offset pagination.
          style: form
          explode: true
          schema:
            type: array
            items: {type: string, enum: [draft, reviewed, finalized, voided]}
        - name: limit
          in: query
          schema: {type: integer, default: 20}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        "200":
          description: List of bills
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          bills:
                            type: array
                            items: {$ref: "#/components/schemas/BillListItem"}
                          counts: {$ref: "#/components/schemas/BillStatusCounts"}
                          next_cursor: {type: string}
        "400":
          description: "Validation failed (VALIDATION_FAILED), an unknown status filter, a status filter combined with offset pagination, or an invalid cursor (INVALID_CURSOR)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/bills/calculate:
    post:
      summary: Preview and calculate provisional bill breakdown without persisting
      operationId: calculateBillBreakdown
      tags: [Bills]
      security: [{bearerAuth: []}]
      parameters:
        - name: group_id
          in: query
          required: false
          schema: {type: string, format: uuid}
          description: ID của nhóm (tuỳ chọn nếu đã có trong request body)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creditor_member_id]
              properties:
                group_id: {type: string, format: uuid}
                creditor_member_id: {type: string, format: uuid}
                subtotal: {type: integer, minimum: 0}
                service_charge: {type: integer, minimum: 0}
                vat: {type: integer, minimum: 0}
                discount: {type: integer, minimum: 0}
                total: {type: integer, minimum: 0}
                split_method:
                  type: string
                  enum: [item_ratio, even]
                items:
                  type: array
                  items: {$ref: "#/components/schemas/CreateBillItemRequest"}
      responses:
        "200":
          description: "Calculation succeeded"
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, example: true}
                  message: {type: string, example: "Thành công"}
                  data:
                    type: object
                    required: [total, is_balanced, breakdown]
                    properties:
                      total: {type: integer, example: 760000}
                      is_balanced: {type: boolean, example: true}
                      breakdown:
                        type: array
                        items: {$ref: "#/components/schemas/MemberAllocation"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/bills/{id}:
    get:
      summary: Get bill detail with breakdown and image URLs
      operationId: getBillDetail
      tags: [Bills]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Bill detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          bill: {$ref: "#/components/schemas/Bill"}
                          breakdown:
                            type: array
                            items: {$ref: "#/components/schemas/MemberAllocation"}
                          signed_urls:
                            type: object
                            additionalProperties: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Update draft bill fields, items, and assignments
      description: PATCH on this same path is accepted as an alias and routes to the identical handler.
      operationId: updateDraftBill
      tags: [Bills]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, total]
              properties:
                version: {type: integer}
                merchant_name: {type: string}
                bill_date: {type: string, format: date-time}
                subtotal: {type: integer, format: int64}
                service_charge: {type: integer, format: int64}
                vat: {type: integer, format: int64}
                discount: {type: integer, format: int64}
                total: {type: integer, format: int64}
                split_method: {type: string, enum: [even, item_ratio, exact, shares, percentage]}
                items:
                  type: array
                  items:
                    type: object
                    required: [name, line_total]
                    properties:
                      name: {type: string}
                      quantity: {type: string}
                      unit_price: {type: integer, format: int64}
                      line_total: {type: integer, format: int64}
                      discount_amount: {type: integer, format: int64, description: "Khuyến mãi riêng cho món này (VND), mặc định 0. Máy chủ tự tính lại final_price, không nhận trực tiếp từ client."}
                      assignments:
                        type: array
                        items:
                          type: object
                          required: [member_id]
                          properties:
                            member_id: {type: string, format: uuid}
                            weight: {type: string}
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: "Stale version (VERSION_CONFLICT), or the bill is no longer a draft (BILL_IMMUTABLE)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      summary: Delete an editable draft bill
      operationId: deleteDraftBill
      tags: [Bills]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: "Draft bill deleted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/bills/{id}/events:
    get:
