openapi: 3.0.3
info:
  title: PaySplit Backend API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: health
      responses:
        "200": {description: Healthy}
  /api/v1/auth/sign-up:
    post:
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignUpRequest"}
      responses:
        "201":
          description: Account created pending email verification
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignUpResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      requestBody: {$ref: "#/components/requestBodies/Token"}
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: {status: {type: string, enum: [active]}}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      requestBody: {$ref: "#/components/requestBodies/Email"}
      responses:
        "202": {$ref: "#/components/responses/EmailAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/sign-in:
    post:
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignInRequest"}
      responses:
        "200":
          description: Signed in and prior device revoked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignInResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token, device_id]
              additionalProperties: false
              properties:
                refresh_token: {type: string, maxLength: 128}
                device_id: {type: string, format: uuid}
      responses:
        "200":
          description: Token pair rotated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Session revoked}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      requestBody: {$ref: "#/components/requestBodies/Email"}
      responses:
        "202": {$ref: "#/components/responses/EmailAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              additionalProperties: false
              properties:
                token: {type: string, maxLength: 128}
                new_password: {$ref: "#/components/schemas/Password"}
      responses:
        "204": {description: Password reset and all sessions revoked}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/users/me:
    get:
      operationId: getMyProfile
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Safe current user profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: {user: {$ref: "#/components/schemas/User"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      operationId: patchMyProfile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfilePatch"}
      responses:
        "200":
          description: Updated safe profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: {user: {$ref: "#/components/schemas/User"}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/users/me/password:
    put:
      operationId: changeMyPassword
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: {type: string, maxLength: 72}
                new_password: {$ref: "#/components/schemas/Password"}
      responses:
        "204": {description: Password changed, current session retained}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/users/me/avatar:
    put:
      operationId: uploadMyAvatar
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              additionalProperties: false
              properties: {avatar: {type: string, format: binary}}
      responses:
        "200":
          description: WebP avatar stored
          content:
            application/json:
              schema:
                type: object
                required: [avatar_url]
                properties: {avatar_url: {type: string, format: uri}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {$ref: "#/components/responses/BadRequest"}
        "502": {$ref: "#/components/responses/BadRequest"}
    delete:
      operationId: deleteMyAvatar
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Avatar reference cleared}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/users/me/fcm-token:
    put:
      operationId: updateMyFCMToken
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token]
              additionalProperties: false
              properties:
                fcm_token: {type: string, minLength: 1}
      responses:
        "200":
          description: FCM token updated
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/groups:
    post:
      operationId: createGroup
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateGroupRequest"}
      responses:
        "201":
          description: Group created with the caller as its active Captain
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreateGroupResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    get:
      operationId: listGroups
      security: [{bearerAuth: []}]
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
          description: Opaque cursor from a prior response's next_cursor
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: Groups where the caller is an active member, newest first
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GroupListResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/groups/{id}:
    get:
      operationId: getGroupDetail
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Group, active members, balances, and the caller's role
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GroupDetailResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/groups/{id}/invites:
    post:
      operationId: createGroupInvite
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateInviteRequest"}
      responses:
        "201":
          description: A new invite was created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteResponse"}
        "200":
          description: The group's one available invite was reused
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
  /api/v1/groups/{id}/invites/{inviteId}:
    delete:
      operationId: revokeGroupInvite
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: inviteId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Invite revoked, idempotent on retry}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/groups/invites/{code}:
    get:
      operationId: previewGroupInvite
      security: [{bearerAuth: []}]
      parameters:
        - name: code
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Group name, active member count, and Captain display name
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvitePreviewResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {$ref: "#/components/responses/InviteUnavailable"}
  /api/v1/groups/join:
    post:
      operationId: joinGroup
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JoinGroupRequest"}
      responses:
        "200":
          description: Joined, reactivated, or already an active member
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JoinGroupResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/GroupMemberLimitReached"}
        "410": {$ref: "#/components/responses/InviteUnavailable"}
  /api/v1/groups/{id}/members/{memberId}:
    delete:
      operationId: leaveOrRemoveMember
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: memberId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Membership marked inactive, idempotent on retry}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: Target has unsettled debts (GROUP_MEMBER_HAS_OPEN_DEBTS), or is the active Captain and must transfer the role first (CAPTAIN_TRANSFER_REQUIRED)
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/OpenDebtsError"}
                  - {$ref: "#/components/schemas/Error"}
  /api/v1/groups/{id}/members/{memberId}/role:
    put:
      operationId: transferCaptain
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: memberId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransferRoleRequest"}
      responses:
        "200":
          description: Captain role transferred to the target member
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaptainTransferResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The group lock for this transfer could not be acquired immediately
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/groups/{id}/activities:
    get:
      operationId: listGroupActivities
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          schema: {type: string}
          description: Opaque cursor from a prior response's next_cursor
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: The group's activity timeline, newest first
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityListResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/notifications:
    get:
      operationId: listNotifications
      security: [{bearerAuth: []}]
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1, minimum: 1}
        - name: page_size
          in: query
          required: false
          schema: {type: integer, default: 20, minimum: 1, maximum: 100}
      responses:
        "200":
          description: Paginated notifications list
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginatedNotifications"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/notifications/unread-count:
    get:
      operationId: getUnreadNotificationsCount
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Unread notifications count
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count: {type: integer, format: int64}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/notifications/read-all:
    patch:
      operationId: markAllNotificationsAsRead
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/notifications/{id}/read:
    patch:
      operationId: markNotificationAsRead
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/bills:
    post:
      summary: Create a manual or image-based bill draft
      operationId: createBill
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [group_id]
              properties:
                group_id: {type: string, format: uuid}
                merchant_name: {type: string}
                images:
                  type: array
                  items: {type: string, format: binary}
                  maxItems: 5
                metadata: {type: string, description: "JSON encoded CreateBillRequest"}
          application/json:
            schema:
              type: object
              required: [group_id, total]
              properties:
                group_id: {type: string, format: uuid}
                merchant_name: {type: string}
                bill_date: {type: string, format: date-time}
                subtotal: {type: integer, format: int64}
                service_charge: {type: integer, format: int64}
                vat: {type: integer, format: int64}
                discount: {type: integer, format: int64}
                total: {type: integer, format: int64}
                split_method: {type: string, enum: [even, item_ratio, exact, shares, percentage]}
                replaces_bill_id: {type: string, format: uuid}
                items:
                  type: array
                  items:
                    type: object
                    required: [name, line_total]
                    properties:
                      name: {type: string}
                      quantity: {type: string}
                      unit_price: {type: integer, format: int64}
                      line_total: {type: integer, format: int64}
                      assignments:
                        type: array
                        items:
                          type: object
                          required: [member_id]
                          properties:
                            member_id: {type: string, format: uuid}
                            weight: {type: string}
      responses:
        "201":
          description: Manual bill created
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
                  is_accepted: {type: boolean}
        "202":
          description: Image bill created and OCR job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
                  ocr_job: {$ref: "#/components/schemas/OCRJob"}
                  is_accepted: {type: boolean}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    get:
      summary: List bills in a group with cursor pagination
      operationId: listBills
      security: [{bearerAuth: []}]
      parameters:
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, default: 20}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        "200":
          description: List of bills
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items: {$ref: "#/components/schemas/Bill"}
                  next_cursor: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/bills/{id}:
    get:
      summary: Get bill detail with breakdown and image URLs
      operationId: getBillDetail
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Bill detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
                  breakdown:
                    type: array
                    items: {$ref: "#/components/schemas/MemberAllocation"}
                  signed_urls:
                    type: object
                    additionalProperties: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Update draft bill fields, items, and assignments
      operationId: updateDraftBill
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, total]
              properties:
                version: {type: integer}
                merchant_name: {type: string}
                bill_date: {type: string, format: date-time}
                subtotal: {type: integer, format: int64}
                service_charge: {type: integer, format: int64}
                vat: {type: integer, format: int64}
                discount: {type: integer, format: int64}
                total: {type: integer, format: int64}
                split_method: {type: string, enum: [even, item_ratio, exact, shares, percentage]}
                items:
                  type: array
                  items:
                    type: object
                    required: [name, line_total]
                    properties:
                      name: {type: string}
                      quantity: {type: string}
                      unit_price: {type: integer, format: int64}
                      line_total: {type: integer, format: int64}
                      assignments:
                        type: array
                        items:
                          type: object
                          required: [member_id]
                          properties:
                            member_id: {type: string, format: uuid}
                            weight: {type: string}
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {description: "Version conflict or bill immutable"}
    delete:
      summary: Delete an editable draft bill
      operationId: deleteDraftBill
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: "Draft bill deleted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/bills/{id}/events:
    get:
      summary: Stream bill events via Server-Sent Events (SSE)
      operationId: streamBillEvents
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/bills/{id}/ocr-retry:
    post:
      summary: Retry OCR extraction for bill images
      operationId: retryOCR
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "202":
          description: OCR retry queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ocr_job: {$ref: "#/components/schemas/OCRJob"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {description: "OCR job already running"}
        "429": {description: "Manual OCR limit reached"}

  /api/v1/bills/{id}/apply-candidate:
    post:
      summary: Apply OCR candidate to draft bill
      operationId: applyCandidate
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id, version]
              properties:
                job_id: {type: string, format: uuid}
                version: {type: integer}
      responses:
        "200":
          description: Draft updated with OCR candidate
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {description: "Version conflict or OCR stale"}

  /api/v1/bills/{id}/review:
    post:
      summary: Mark a reconciled draft bill as reviewed
      operationId: reviewBill
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer}
      responses:
        "200":
          description: Bill reviewed
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {description: "Version conflict"}
        "422": {description: "Bill not ready for review"}

  /api/v1/bills/{id}/finalize:
    post:
      summary: Finalize a reviewed bill into immutable shares and debts
      operationId: finalizeBill
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer}
      responses:
        "200":
          description: Bill finalized
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {description: "Version conflict or review required"}
        "422": {description: "Bank account required or bill not ready"}

  /api/v1/bills/{id}/void:
    post:
      summary: Void an unpaid finalized bill
      operationId: voidBill
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version: {type: integer}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        "200":
          description: Bill voided
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {description: "Bill already voided or payment already started"}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  requestBodies:
    Token:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            additionalProperties: false
            properties: {token: {type: string, maxLength: 128}}
    Email:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            additionalProperties: false
            properties: {email: {type: string, format: email, maxLength: 254}}
  responses:
    BadRequest:
      description: Validation or invalid token error
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unauthorized:
      description: Authentication or session error
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Forbidden:
      description: Account is not eligible
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Conflict:
      description: Unique email or phone conflict
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotFound:
      description: Resource missing, or the caller is not authorized to see it
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    CaptainRequired:
      description: Caller is not the group's active Captain
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    InviteUnavailable:
      description: Invite is expired, revoked, or exhausted (one public code for all three)
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    GroupMemberLimitReached:
      description: Group already has 50 active members
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    RateLimited:
      description: Rolling limit exceeded
      headers:
        Retry-After: {schema: {type: integer}, description: Seconds until retry}
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    EmailAccepted:
      description: Generic response that does not reveal account existence
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties: {message: {type: string}}
  schemas:
    Password:
      type: string
      minLength: 8
      maxLength: 72
      description: 8 to 72 bytes with lowercase, uppercase, and a digit
    SignUpRequest:
      type: object
      required: [email, phone_number, display_name, password]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254}
        phone_number: {type: string, description: Vietnamese local input or E.164}
        display_name: {type: string, minLength: 1, maxLength: 100}
        password: {$ref: "#/components/schemas/Password"}
    SignInRequest:
      type: object
      required: [email, password, device_id]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, maxLength: 72}
        device_id: {type: string, format: uuid}
        device_name: {type: string, maxLength: 120}
    User:
      type: object
      required: [id, email, phone_number, display_name, role, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        phone_number: {type: string}
        display_name: {type: string}
        role: {type: string, enum: [user, admin]}
        status: {type: string, enum: [pending_verification, active, suspended, locked]}
        email_verified_at: {type: string, format: date-time, nullable: true}
        bank_code: {type: string, nullable: true}
        bank_account_number: {type: string, nullable: true}
        bank_account_holder: {type: string, nullable: true}
        avatar_url: {type: string, format: uri, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SignUpResponse:
      type: object
      required: [user, verification_email_sent, verification_expires_at]
      properties:
        user: {$ref: "#/components/schemas/User"}
        verification_email_sent: {type: boolean}
        verification_expires_at: {type: string, format: date-time}
    TokenPair:
      type: object
      required: [token_type, access_token, access_token_expires_at, refresh_token, refresh_token_expires_at]
      properties:
        token_type: {type: string, enum: [Bearer]}
        access_token: {type: string}
        access_token_expires_at: {type: string, format: date-time}
        refresh_token: {type: string}
        refresh_token_expires_at: {type: string, format: date-time}
    SignInResponse:
      allOf:
        - {$ref: "#/components/schemas/TokenPair"}
        - type: object
          required: [user]
          properties: {user: {$ref: "#/components/schemas/User"}}
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string, minLength: 1, maxLength: 100}
        phone_number: {type: string}
        bank_code: {type: string, nullable: true}
        bank_account_number: {type: string, pattern: "^[0-9]{6,19}$", nullable: true}
        bank_account_holder: {type: string, minLength: 1, maxLength: 100, nullable: true}
    Notification:
      type: object
      required: [id, user_id, type, title, body, created_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        type: {type: string}
        title: {type: string}
        body: {type: string}
        payload: {type: object, nullable: true}
        read_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
    PaginationMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page: {type: integer}
        page_size: {type: integer}
        total_items: {type: integer, format: int64}
        total_pages: {type: integer}
    PaginatedNotifications:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Notification"}
        meta: {$ref: "#/components/schemas/PaginationMeta"}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            fields: {type: object, additionalProperties: {type: string}}
    OpenDebtsError:
      description: Error variant for GROUP_MEMBER_HAS_OPEN_DEBTS, carrying the target's outstanding amounts
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields]
          properties:
            code: {type: string, enum: [GROUP_MEMBER_HAS_OPEN_DEBTS]}
            message: {type: string}
            fields:
              type: object
              required: [payable_amount, receivable_amount]
              properties:
                payable_amount: {type: string, description: Decimal VND string the target still owes others}
                receivable_amount: {type: string, description: Decimal VND string others still owe the target}
    CreateGroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Trimmed to 1-100 Unicode code points}
        currency: {type: string, enum: [VND], description: Optional; only VND is accepted in v1}
    Group:
      type: object
      required: [id, name, currency, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        currency: {type: string, enum: [VND]}
        created_at: {type: string, format: date-time}
    Membership:
      type: object
      required: [id, group_id, user_id, role, status, joined_at, left_at]
      properties:
        id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        role: {type: string, enum: [captain, member]}
        status: {type: string, enum: [active, inactive]}
        joined_at: {type: string, format: date-time}
        left_at: {type: string, format: date-time, nullable: true}
    Member:
      type: object
      required: [membership_id, user_id, display_name, avatar_url, role, joined_at]
      properties:
        membership_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        avatar_url: {type: string, format: uri, nullable: true}
        role: {type: string, enum: [captain, member]}
        joined_at: {type: string, format: date-time}
    Balance:
      type: object
      required: [member_id, net_balance]
      properties:
        member_id: {type: string, format: uuid}
        net_balance: {type: string, description: Decimal VND string; positive means the member is owed}
    GroupListItem:
      type: object
      required: [group, caller_membership_id, caller_role, active_member_count]
      properties:
        group: {$ref: "#/components/schemas/Group"}
        caller_membership_id: {type: string, format: uuid}
        caller_role: {type: string, enum: [captain, member]}
        active_member_count: {type: integer}
    CreateGroupResponse:
      type: object
      required: [group, membership]
      properties:
        group: {$ref: "#/components/schemas/Group"}
        membership: {$ref: "#/components/schemas/Membership"}
    GroupListResponse:
      type: object
      required: [groups, next_cursor]
      properties:
        groups: {type: array, items: {$ref: "#/components/schemas/GroupListItem"}}
        next_cursor: {type: string, nullable: true}
    GroupDetailResponse:
      type: object
      required: [group, members, balances, caller_role]
      properties:
        group: {$ref: "#/components/schemas/Group"}
        members: {type: array, items: {$ref: "#/components/schemas/Member"}}
        balances: {type: array, items: {$ref: "#/components/schemas/Balance"}}
        caller_role: {type: string, enum: [captain, member]}
    CreateInviteRequest:
      type: object
      additionalProperties: false
      properties:
        expires_in_hours: {type: integer, minimum: 1, maximum: 168, default: 24}
        max_uses: {type: integer, minimum: 1, maximum: 50, nullable: true, description: Optional; unlimited when omitted}
        regenerate: {type: boolean, default: false, description: Revoke every available invite first and create one new one}
    Invite:
      type: object
      required: [id, code, invite_url, expires_at, max_uses, use_count]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, description: Sensitive; only ever returned by create or reuse}
        invite_url: {type: string, description: APP_INVITE_BASE_URL plus the encoded invite code}
        expires_at: {type: string, format: date-time}
        max_uses: {type: integer, nullable: true}
        use_count: {type: integer}
    InviteResponse:
      type: object
      required: [invite]
      properties:
        invite: {$ref: "#/components/schemas/Invite"}
    InvitePreview:
      type: object
      required: [group_name, active_member_count, captain_display_name]
      properties:
        group_name: {type: string}
        active_member_count: {type: integer}
        captain_display_name: {type: string}
    InvitePreviewResponse:
      type: object
      required: [preview]
      properties:
        preview: {$ref: "#/components/schemas/InvitePreview"}
    JoinGroupRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: {type: string}
    JoinResult:
      type: object
      required: [group_id, membership_id, role, status, result]
      properties:
        group_id: {type: string, format: uuid}
        membership_id: {type: string, format: uuid}
        role: {type: string, enum: [captain, member]}
        status: {type: string, enum: [active, inactive]}
        result: {type: string, enum: [joined, reactivated, already_active]}
    JoinGroupResponse:
      type: object
      required: [join]
      properties:
        join: {$ref: "#/components/schemas/JoinResult"}
    TransferRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: {type: string, enum: [captain]}
    CaptainTransfer:
      type: object
      required: [previous_captain_member_id, current_captain_member_id]
      properties:
        previous_captain_member_id: {type: string, format: uuid}
        current_captain_member_id: {type: string, format: uuid}
    CaptainTransferResponse:
      type: object
      required: [transfer]
      properties:
        transfer: {$ref: "#/components/schemas/CaptainTransfer"}
    ActivityActor:
      type: object
      required: [member_id, user_id, display_name, avatar_url]
      properties:
        member_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        avatar_url: {type: string, format: uri, nullable: true}
    Activity:
      type: object
      required: [id, action_type, description, actor, metadata, created_at]
      properties:
        id: {type: string, format: uuid}
        action_type:
          type: string
          enum: [group_created, invite_created, invite_revoked, member_joined, member_reactivated, member_left, member_removed, captain_transferred]
        description: {type: string}
        actor: {$ref: "#/components/schemas/ActivityActor"}
        metadata: {type: object, description: "Exact keys per action_type; never includes an invite code"}
        created_at: {type: string, format: date-time}
    ActivityListResponse:
      type: object
      required: [activities, next_cursor]
      properties:
        activities: {type: array, items: {$ref: "#/components/schemas/Activity"}}
        next_cursor: {type: string, nullable: true}

    Bill:
      type: object
      required: [id, group_id, creditor_member_id, status, subtotal, service_charge, vat, discount, total, version]
      properties:
        id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        creditor_member_id: {type: string, format: uuid}
        status: {type: string, enum: [draft, reviewed, finalized, voided]}
        merchant_name: {type: string, nullable: true}
        bill_date: {type: string, format: date-time, nullable: true}
        subtotal: {type: integer, format: int64}
        service_charge: {type: integer, format: int64}
        vat: {type: integer, format: int64}
        discount: {type: integer, format: int64}
        total: {type: integer, format: int64}
        split_method: {type: string, enum: [even, item_ratio, exact, shares, percentage]}
        mismatch_codes: {type: array, items: {type: string}}
        replaces_bill_id: {type: string, format: uuid, nullable: true}
        version: {type: integer}
        finalized_at: {type: string, format: date-time, nullable: true}
        voided_at: {type: string, format: date-time, nullable: true}
        reviewed_at: {type: string, format: date-time, nullable: true}
        reviewed_by_member_id: {type: string, format: uuid, nullable: true}
        images: {type: array, items: {$ref: "#/components/schemas/BillImage"}}
        items: {type: array, items: {$ref: "#/components/schemas/BillItem"}}
        shares: {type: array, items: {$ref: "#/components/schemas/BillShare"}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    BillImage:
      type: object
      required: [id, bill_id, image_key, position]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        image_key: {type: string}
        position: {type: integer}
        created_at: {type: string, format: date-time}

    BillItem:
      type: object
      required: [id, bill_id, name, quantity, unit_price, line_total, position]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        name: {type: string}
        quantity: {type: string}
        unit_price: {type: integer, format: int64}
        line_total: {type: integer, format: int64}
        position: {type: integer}
        assignments: {type: array, items: {$ref: "#/components/schemas/BillItemAssignment"}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    BillItemAssignment:
      type: object
      required: [id, bill_item_id, member_id, weight]
      properties:
        id: {type: string, format: uuid}
        bill_item_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        member_id: {type: string, format: uuid}
        weight: {type: string}
        created_at: {type: string, format: date-time}

    BillShare:
      type: object
      required: [id, bill_id, member_id, final_amount]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        member_id: {type: string, format: uuid}
        item_subtotal: {type: integer, format: int64}
        service_charge_share: {type: integer, format: int64}
        vat_share: {type: integer, format: int64}
        discount_share: {type: integer, format: int64}
        rounding_adjustment: {type: integer, format: int64}
        final_amount: {type: integer, format: int64}
        created_at: {type: string, format: date-time}

    MemberAllocation:
      type: object
      required: [member_id, item_subtotal, service_charge_share, vat_share, discount_share, final_amount]
      properties:
        member_id: {type: string, format: uuid}
        item_subtotal: {type: integer, format: int64}
        service_charge_share: {type: integer, format: int64}
        vat_share: {type: integer, format: int64}
        discount_share: {type: integer, format: int64}
        final_amount: {type: integer, format: int64}

    OCRJob:
      type: object
      required: [id, bill_id, status, provider, attempts, version]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, processing, succeeded, failed]}
        provider: {type: string}
        attempts: {type: integer}
        candidate: {type: object}
        error_message: {type: string, nullable: true}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}
