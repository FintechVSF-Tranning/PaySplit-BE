      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          schema: {type: string}
          description: Opaque cursor from a prior response's next_cursor
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: The group's activity timeline, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/ActivityListResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/groups/{id}/sync:
    get:
      summary: Catch up a client's local group state
      description: |
        Đường catch-up nguội của giao thức đồng bộ nhóm. Client gửi version nó
        đang giữ; server trả các sự kiện còn thiếu (mode=delta) hoặc toàn bộ
        trạng thái (mode=snapshot) khi client tụt quá xa, chưa có version, hoặc
        gửi version lớn hơn version hiện tại của nhóm.

        Dùng khi mở app lạnh, app resume, mạng vừa nối lại, bị push đánh thức,
        hoặc khi client không dùng được SSE và phải poll.
      operationId: syncGroup
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: since
          in: query
          description: Version client đang giữ. Bỏ trống hoặc 0 luôn cho ra snapshot.
          schema: {type: integer, format: int64, minimum: 0, default: 0}
      responses:
        "200":
          description: Delta hoặc snapshot, tùy khoảng cách giữa since và version hiện tại
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/GroupSyncResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/groups/{id}/events:
    get:
      summary: Stream group events via Server-Sent Events (SSE)
      description: |
        Kênh nóng của giao thức đồng bộ nhóm. Không bọc SuccessEnvelope: response
        là text/event-stream.

        Sự kiện đầu tiên luôn là `snapshot` (khi client tụt quá xa hoặc chưa có
        version) hoặc chuỗi sự kiện còn thiếu; client đã bắt kịp nhận một sự
        kiện `sync` rỗng.

        Thân của mỗi frame sự kiện nhật ký mang đúng shape với phần tử `events`
        của `/sync` (`GroupSyncEvent`: {version, type, data}), nên client dùng
        lại một hàm giải mã cho cả hai kênh. Trường `id:` của frame cũng là
        version, dành cho client dùng EventSource chuẩn.

        Ngoài ra: `heartbeat` mỗi 15 giây và `close` kèm `reason` khi kết nối
        chạm tuổi thọ tối đa (`max_connection_age`), khi nhóm bị giải tán
        (`group_archived`), hoặc khi chính caller không còn là thành viên
        (`membership_ended`).

        Client phải mở lại kết nối với `since` bằng version cuối cùng đã áp;
        version nhảy cóc nghĩa là đã sót sự kiện và phải gọi `/sync`.
        Deprecated: thay bằng `GET /api/v1/users/me/events`. Hành vi hiện tại
        không đổi; sau khi cutover hoàn tất, endpoint này sẽ trả 410 với body
        `STREAM_REPLACED` mô tả bên dưới.
      deprecated: true
      operationId: streamGroupEvents
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: since
          in: query
          description: Version client đang giữ. Bỏ trống hoặc 0 sẽ nhận snapshot.
          schema: {type: integer, format: int64, minimum: 0, default: 0}
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "410": {$ref: "#/components/responses/StreamReplaced"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      security: [{bearerAuth: []}]
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1, minimum: 1}
        - name: page_size
          in: query
