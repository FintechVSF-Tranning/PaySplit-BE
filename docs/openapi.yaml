openapi: 3.0.3
info:
  title: PaySplit Backend API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: health
      responses:
        "200": {description: Healthy}
  /api/v1/auth/sign-up:
    post:
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignUpRequest"}
      responses:
        "201":
          description: Account created pending email verification
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignUpResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      requestBody: {$ref: "#/components/requestBodies/VerifyEmail"}
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: {status: {type: string, enum: [active]}}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      requestBody: {$ref: "#/components/requestBodies/Email"}
      responses:
        "202": {$ref: "#/components/responses/EmailAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/sign-in:
    post:
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignInRequest"}
      responses:
        "200":
          description: Signed in and prior device revoked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignInResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token, device_id]
              additionalProperties: false
              properties:
                refresh_token: {type: string, maxLength: 128}
                device_id: {type: string, format: uuid}
      responses:
        "200":
          description: Token pair rotated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Session revoked}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      requestBody: {$ref: "#/components/requestBodies/Email"}
      responses:
        "202": {$ref: "#/components/responses/EmailAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, new_password]
              additionalProperties: false
              properties:
                email: {type: string, format: email, maxLength: 254}
                otp: {type: string, pattern: '^[0-9]{6}$', minLength: 6, maxLength: 6}
                new_password: {$ref: "#/components/schemas/Password"}
      responses:
        "204": {description: Password reset and all sessions revoked}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/users/me:
    get:
      operationId: getMyProfile
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Safe current user profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: {user: {$ref: "#/components/schemas/User"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      operationId: patchMyProfile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfilePatch"}
      responses:
        "200":
          description: Updated safe profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: {user: {$ref: "#/components/schemas/User"}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/users/me/password:
    put:
      operationId: changeMyPassword
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: {type: string, maxLength: 72}
                new_password: {$ref: "#/components/schemas/Password"}
      responses:
        "204": {description: Password changed, current session retained}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/users/me/avatar:
    put:
      operationId: uploadMyAvatar
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              additionalProperties: false
              properties: {avatar: {type: string, format: binary}}
      responses:
        "200":
          description: WebP avatar stored
          content:
            application/json:
              schema:
                type: object
                required: [avatar_url]
                properties: {avatar_url: {type: string, format: uri}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {$ref: "#/components/responses/BadRequest"}
        "502": {$ref: "#/components/responses/BadRequest"}
    delete:
      operationId: deleteMyAvatar
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Avatar reference cleared}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/users/me/fcm-token:
    put:
      operationId: updateMyFCMToken
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token]
              additionalProperties: false
              properties:
                fcm_token: {type: string, minLength: 1}
      responses:
        "200":
          description: FCM token updated
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/banks:
    get:
      operationId: listBanks
      summary: List supported and available banks
      description: Returns the list of banks from the VietQR snapshot directory.
      parameters:
        - name: supported
          in: query
          required: false
          schema:
            type: boolean
          description: Optional filter to return only supported (true) or unsupported (false) banks.
      responses:
        "200":
          description: List of banks
          headers:
            Cache-Control:
              schema: {type: string, example: "public, max-age=86400"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankListResponse"}
  /api/v1/groups:
    post:
      operationId: createGroup
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateGroupRequest"}
      responses:
        "201":
          description: Group created with the caller as its active Captain
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreateGroupResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    get:
      operationId: listGroups
      security: [{bearerAuth: []}]
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
          description: Opaque cursor from a prior response's next_cursor
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: Groups where the caller is an active member, newest first
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GroupListResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/groups/{id}:
    get:
      operationId: getGroupDetail
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Group, active members, balances, and the caller's role
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GroupDetailResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/groups/{id}/invites:
    post:
      operationId: createGroupInvite
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateInviteRequest"}
      responses:
        "201":
          description: A new invite was created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteResponse"}
        "200":
          description: The group's one available invite was reused
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
  /api/v1/groups/{id}/invites/{inviteId}:
    delete:
      operationId: revokeGroupInvite
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: inviteId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Invite revoked, idempotent on retry}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/groups/invites/{code}:
    get:
      operationId: previewGroupInvite
      security: [{bearerAuth: []}]
      parameters:
        - name: code
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Group name, active member count, and Captain display name
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvitePreviewResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {$ref: "#/components/responses/InviteUnavailable"}
  /api/v1/groups/join:
    post:
      operationId: joinGroup
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JoinGroupRequest"}
      responses:
        "200":
          description: Joined, reactivated, or already an active member
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JoinGroupResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/GroupMemberLimitReached"}
        "410": {$ref: "#/components/responses/InviteUnavailable"}
  /api/v1/groups/{id}/members/{memberId}:
    delete:
      operationId: leaveOrRemoveMember
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: memberId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Membership marked inactive, idempotent on retry}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: Target has unsettled debts (GROUP_MEMBER_HAS_OPEN_DEBTS), or is the active Captain and must transfer the role first (CAPTAIN_TRANSFER_REQUIRED)
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/OpenDebtsError"}
                  - {$ref: "#/components/schemas/Error"}
  /api/v1/groups/{id}/members/{memberId}/role:
    put:
      operationId: transferCaptain
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: memberId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransferRoleRequest"}
      responses:
        "200":
          description: Captain role transferred to the target member
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaptainTransferResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The group lock for this transfer could not be acquired immediately
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/groups/{id}/activities:
    get:
      operationId: listGroupActivities
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          schema: {type: string}
          description: Opaque cursor from a prior response's next_cursor
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: The group's activity timeline, newest first
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityListResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/notifications:
    get:
      operationId: listNotifications
      security: [{bearerAuth: []}]
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1, minimum: 1}
        - name: page_size
          in: query
          required: false
          schema: {type: integer, default: 20, minimum: 1, maximum: 100}
      responses:
        "200":
          description: Paginated notifications list
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginatedNotifications"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/notifications/unread-count:
    get:
      operationId: getUnreadNotificationsCount
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Unread notifications count
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count: {type: integer, format: int64}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/notifications/read-all:
    patch:
      operationId: markAllNotificationsAsRead
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/notifications/{id}/read:
    patch:
      operationId: markNotificationAsRead
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/bills:
    post:
      summary: Create a manual or image-based bill draft
      operationId: createBill
      security: [{bearerAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string}
          description: Optional client-generated key. A repeated key with the same request body replays the original response (200/201/202); a repeated key with a different body returns 409 IDEMPOTENCY_KEY_REUSED; a key still processing returns 409 IDEMPOTENCY_IN_PROGRESS.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [group_id]
              properties:
                group_id: {type: string, format: uuid}
                merchant_name: {type: string}
                images:
                  type: array
                  items: {type: string, format: binary}
                  maxItems: 5
                metadata: {type: string, description: "JSON encoded CreateBillRequest"}
          application/json:
            schema:
              type: object
              required: [group_id, total]
              properties:
                group_id: {type: string, format: uuid}
                merchant_name: {type: string}
                bill_date: {type: string, format: date-time}
                subtotal: {type: integer, format: int64}
                service_charge: {type: integer, format: int64}
                vat: {type: integer, format: int64}
                discount: {type: integer, format: int64}
                total: {type: integer, format: int64}
                split_method: {type: string, enum: [even, item_ratio, exact, shares, percentage]}
                replaces_bill_id: {type: string, format: uuid}
                items:
                  type: array
                  items:
                    type: object
                    required: [name, line_total]
                    properties:
                      name: {type: string}
                      quantity: {type: string}
                      unit_price: {type: integer, format: int64}
                      line_total: {type: integer, format: int64}
                      discount_amount: {type: integer, format: int64, description: "Khuyến mãi riêng cho món này (VND), mặc định 0. Máy chủ tự tính lại final_price, không nhận trực tiếp từ client."}
                      assignments:
                        type: array
                        items:
                          type: object
                          required: [member_id]
                          properties:
                            member_id: {type: string, format: uuid}
                            weight: {type: string}
      responses:
        "201":
          description: Manual bill created
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
                  is_accepted: {type: boolean}
        "202":
          description: Image bill created and OCR job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
                  ocr_job: {$ref: "#/components/schemas/OCRJob"}
                  is_accepted: {type: boolean}
        "400":
          description: "Validation failed (VALIDATION_FAILED), or images required for an image-based draft (IMAGES_REQUIRED)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: "Idempotency-Key reused with a different request body (IDEMPOTENCY_KEY_REUSED), or the same key is still being processed (IDEMPOTENCY_IN_PROGRESS)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    get:
      summary: List bills in a group with cursor pagination
      operationId: listBills
      security: [{bearerAuth: []}]
      parameters:
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, default: 20}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        "200":
          description: List of bills
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items: {$ref: "#/components/schemas/Bill"}
                  next_cursor: {type: string}
        "400":
          description: "Validation failed (VALIDATION_FAILED), or an invalid cursor was supplied (INVALID_CURSOR)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/bills/{id}:
    get:
      summary: Get bill detail with breakdown and image URLs
      operationId: getBillDetail
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Bill detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
                  breakdown:
                    type: array
                    items: {$ref: "#/components/schemas/MemberAllocation"}
                  signed_urls:
                    type: object
                    additionalProperties: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Update draft bill fields, items, and assignments
      description: PATCH on this same path is accepted as an alias and routes to the identical handler.
      operationId: updateDraftBill
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, total]
              properties:
                version: {type: integer}
                merchant_name: {type: string}
                bill_date: {type: string, format: date-time}
                subtotal: {type: integer, format: int64}
                service_charge: {type: integer, format: int64}
                vat: {type: integer, format: int64}
                discount: {type: integer, format: int64}
                total: {type: integer, format: int64}
                split_method: {type: string, enum: [even, item_ratio, exact, shares, percentage]}
                items:
                  type: array
                  items:
                    type: object
                    required: [name, line_total]
                    properties:
                      name: {type: string}
                      quantity: {type: string}
                      unit_price: {type: integer, format: int64}
                      line_total: {type: integer, format: int64}
                      discount_amount: {type: integer, format: int64, description: "Khuyến mãi riêng cho món này (VND), mặc định 0. Máy chủ tự tính lại final_price, không nhận trực tiếp từ client."}
                      assignments:
                        type: array
                        items:
                          type: object
                          required: [member_id]
                          properties:
                            member_id: {type: string, format: uuid}
                            weight: {type: string}
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: "Stale version (VERSION_CONFLICT), or the bill is no longer a draft (BILL_IMMUTABLE)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      summary: Delete an editable draft bill
      operationId: deleteDraftBill
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: "Draft bill deleted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/bills/{id}/events:
    get:
      summary: Stream bill events via Server-Sent Events (SSE)
      operationId: streamBillEvents
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/bills/{id}/ocr-retry:
    post:
      summary: Retry OCR extraction for bill images
      operationId: retryOCR
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "202":
          description: OCR retry queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ocr_job: {$ref: "#/components/schemas/OCRJob"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: "OCR job already running (OCR_ALREADY_RUNNING)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "429":
          description: "Manual OCR retry limit reached (OCR_LIMIT_REACHED)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "502":
          description: "OCR provider returned a malformed result (OCR_SCHEMA_INVALID)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "503":
          description: "OCR provider unavailable (OCR_PROVIDER_UNAVAILABLE)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "504":
          description: "OCR provider timed out (OCR_TIMEOUT)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/v1/bills/{id}/apply-candidate:
    post:
      summary: Apply OCR candidate to draft bill
      operationId: applyCandidate
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id, version]
              properties:
                job_id: {type: string, format: uuid}
                version: {type: integer}
      responses:
        "200":
          description: Draft updated with OCR candidate
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: "OCR job not found (OCR_JOB_NOT_FOUND)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: "Stale bill version (VERSION_CONFLICT), the OCR job result is stale relative to the draft (OCR_RESULT_STALE), the job's candidate was already applied (OCR_ALREADY_APPLIED), or the job is not finished yet (OCR_NOT_READY)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: "OCR candidate failed validation (OCR_CANDIDATE_INVALID)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/v1/bills/{id}/review:
    post:
      summary: Mark a reconciled draft bill as reviewed
      operationId: reviewBill
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer}
      responses:
        "200":
          description: Bill reviewed
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: "Stale version (VERSION_CONFLICT)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: "Bill has unresolved mismatches, is not in a reviewable state, or has no Creditor (BILL_NOT_READY), or the discount cannot be allocated across the assigned members (DISCOUNT_NOT_ALLOCATABLE)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/v1/bills/{id}/finalize:
    post:
      summary: Finalize a reviewed bill into immutable shares and debts
      operationId: finalizeBill
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer}
      responses:
        "200":
          description: Bill finalized
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: "Stale version (VERSION_CONFLICT)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: "Creditor has no bank account on file (BANK_ACCOUNT_REQUIRED), the bill has not been reviewed yet (BILL_NOT_READY), or the discount is valid in total but concentrated on members who cannot absorb it so the cascade drives the Creditor below zero (DISCOUNT_NOT_ALLOCATABLE)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/v1/bills/{id}/void:
    post:
      summary: Void an unpaid finalized bill
      operationId: voidBill
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version: {type: integer}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        "200":
          description: Bill voided
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: "Bill already voided (BILL_ALREADY_VOIDED), or a payment for this bill has already started (PAYMENT_ALREADY_STARTED)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/v1/groups/{groupId}/expenses/me:
    get:
      operationId: getMyGroupExpenses
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: Personal finalized bill allocations, content: {application/json: {schema: {$ref: "#/components/schemas/ExpensePage"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/groups/{groupId}/debts:
    get:
      operationId: listGroupDebts
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
        - {name: debtor_member_id, in: query, schema: {type: string, format: uuid}}
        - {name: creditor_member_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [awaiting, pending_confirmation, settled]}}
      responses:
        "200": {description: Filtered debts plus unfiltered group totals, content: {application/json: {schema: {$ref: "#/components/schemas/DebtPage"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/groups/{groupId}/debts/{debtId}/remind:
    post:
      operationId: remindDebt
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {name: debtId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200": {description: Reminder claimed, content: {application/json: {schema: {$ref: "#/components/schemas/ReminderResult"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/groups/{groupId}/payments/qr:
    post:
      operationId: generatePaymentQR
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/GeneratePaymentRequest"}}}}
      responses:
        "200": {description: Matching pending payment replayed, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentEnvelope"}}}}
        "201": {description: Payment created, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentEnvelope"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
  /api/v1/groups/{groupId}/payments/{paymentId}:
    get:
      operationId: getPayment
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/PaymentId"}
      responses:
        "200": {description: Payment detail, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentEnvelope"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
  /api/v1/groups/{groupId}/payments/{paymentId}/proof:
    post:
      operationId: submitPaymentProof
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/PaymentId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties: {image: {type: string, format: binary}, note: {type: string, maxLength: 500}}
      responses:
        "200": {description: Proof accepted, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentEnvelope"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "503": {description: Private storage unavailable}
  /api/v1/groups/{groupId}/payments/{paymentId}/confirm:
    post:
      operationId: confirmPayment
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/PaymentId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200": {description: Payment and every covered debt settled, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentMutationEnvelope"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/groups/{groupId}/payments/{paymentId}/reject:
    post:
      operationId: rejectPayment
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/PaymentId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 500}}}}}}
      responses:
        "200": {description: Payment rejected and covered debts reset, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentMutationEnvelope"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    GroupId: {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
    PaymentId: {name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1}}
  requestBodies:
    VerifyEmail:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, otp]
            additionalProperties: false
            properties:
              email: {type: string, format: email, maxLength: 254}
              otp: {type: string, pattern: '^[0-9]{6}$', minLength: 6, maxLength: 6}
    Email:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            additionalProperties: false
            properties: {email: {type: string, format: email, maxLength: 254}}
  responses:
    BadRequest:
      description: Validation or invalid token error
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unauthorized:
      description: Authentication or session error
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Forbidden:
      description: Account is not eligible
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Conflict:
      description: Unique email or phone conflict
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotFound:
      description: Resource missing, or the caller is not authorized to see it
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    UnprocessableEntity:
      description: The request is valid but required business data is incomplete
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    CaptainRequired:
      description: Caller is not the group's active Captain
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    InviteUnavailable:
      description: Invite is expired, revoked, or exhausted (one public code for all three)
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    GroupMemberLimitReached:
      description: Group already has 50 active members
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    RateLimited:
      description: Rolling limit exceeded
      headers:
        Retry-After: {schema: {type: integer}, description: Seconds until retry}
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    EmailAccepted:
      description: Generic response that does not reveal account existence
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties: {message: {type: string}}
  schemas:
    GeneratePaymentRequest:
      type: object
      required: [creditor_member_id]
      properties:
        creditor_member_id: {type: string, format: uuid}
        debt_ids: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
    RecipientBank:
      type: object
      required: [bank_code, bank_name, account_number, account_holder]
      properties:
        bank_code: {type: string, description: VietQR bank BIN}
        bank_name: {type: string}
        account_number: {type: string}
        account_holder: {type: string}
    Payment:
      type: object
      required: [id, group_id, debtor_member_id, creditor_member_id, amount, reference_code, status, covered_debt_ids, created_at]
      properties:
        id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        debtor_member_id: {type: string, format: uuid}
        creditor_member_id: {type: string, format: uuid}
        amount: {type: string, pattern: '^[0-9]+$'}
        reference_code: {type: string, pattern: '^PAY[A-HJ-NP-Z2-9]{8}$'}
        status: {type: string, enum: [pending_proof, pending_confirmation, confirmed, rejected, superseded]}
        qr_payload: {type: string, nullable: true}
        qr_image_url: {type: string, format: uri, nullable: true}
        recipient: {allOf: [{$ref: "#/components/schemas/RecipientBank"}], nullable: true}
        image_url: {type: string, format: uri, nullable: true}
        note: {type: string, nullable: true}
        rejection_reason: {type: string, nullable: true}
        covered_debt_ids: {type: array, items: {type: string, format: uuid}}
        created_at: {type: string, format: date-time}
        submitted_at: {type: string, format: date-time, nullable: true}
        confirmed_at: {type: string, format: date-time, nullable: true}
        rejected_at: {type: string, format: date-time, nullable: true}
    PaymentEnvelope:
      type: object
      required: [payment]
      properties: {payment: {$ref: "#/components/schemas/Payment"}}
    PaymentMutationEnvelope:
      type: object
      required: [payment]
      properties:
        payment: {$ref: "#/components/schemas/Payment"}
        settled_debts: {type: array, items: {type: string, format: uuid}}
        reset_debts: {type: array, items: {type: string, format: uuid}}
    ReminderResult:
      type: object
      required: [debt_id, reminder_count, reminded_at]
      properties: {debt_id: {type: string, format: uuid}, reminder_count: {type: integer, minimum: 1, maximum: 3}, reminded_at: {type: string, format: date-time}}
    ExpenseItem:
      type: object
      required: [item_name, quantity, unit_price, line_total, item_discount_amount, item_final_price, share_ratio, item_share]
      properties:
        item_name: {type: string}
        quantity: {type: string}
        unit_price: {type: string}
        line_total: {type: string}
        item_discount_amount: {type: string}
        item_final_price: {type: string}
        share_ratio: {type: string}
        item_share: {type: string}
    ExpenseAllocation:
      type: object
      required: [item_subtotal, service_charge_share, vat_share, discount_share, rounding_adjustment, final_amount]
      properties:
        item_subtotal: {type: string}
        service_charge_share: {type: string}
        vat_share: {type: string}
        discount_share: {type: string}
        rounding_adjustment: {type: string}
        final_amount: {type: string}
    ExpenseBill:
      type: object
      required: [bill_id, bill_date, merchant_name, creditor_member_id, creditor_display_name, debt_id, debt_status, allocation, items]
      properties:
        bill_id: {type: string, format: uuid}
        bill_date: {type: string, format: date}
        merchant_name: {type: string}
        creditor_member_id: {type: string, format: uuid}
        creditor_display_name: {type: string}
        debt_id: {type: string, format: uuid, nullable: true}
        debt_status: {type: string, enum: [awaiting, pending_confirmation, settled, voided], nullable: true}
        allocation: {$ref: "#/components/schemas/ExpenseAllocation"}
        items: {type: array, items: {$ref: "#/components/schemas/ExpenseItem"}}
    ExpensePage:
      type: object
      required: [summary, bills, next_cursor]
      properties:
        summary:
          type: object
          required: [total_owed, total_settled, total_receivable, net_balance]
          properties: {total_owed: {type: string}, total_settled: {type: string}, total_receivable: {type: string}, net_balance: {type: string}}
        bills: {type: array, items: {$ref: "#/components/schemas/ExpenseBill"}}
        next_cursor: {type: string, nullable: true}
    Debt:
      type: object
      required: [id, bill_id, bill_date, merchant_name, debtor_member_id, debtor_display_name, debtor_avatar_url, creditor_member_id, creditor_display_name, creditor_avatar_url, amount, status, reminder_count, payment_id, created_at, settled_at]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        bill_date: {type: string, format: date}
        merchant_name: {type: string}
        debtor_member_id: {type: string, format: uuid}
        debtor_display_name: {type: string}
        debtor_avatar_url: {type: string, format: uri, nullable: true}
        creditor_member_id: {type: string, format: uuid}
        creditor_display_name: {type: string}
        creditor_avatar_url: {type: string, format: uri, nullable: true}
        amount: {type: string}
        status: {type: string, enum: [awaiting, pending_confirmation, settled, voided]}
        reminder_count: {type: integer, minimum: 0, maximum: 3}
        payment_id: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}
        settled_at: {type: string, format: date-time, nullable: true}
    DebtMatrixEntry:
      type: object
      required: [debtor_member_id, creditor_member_id, total_amount, debt_count]
      properties:
        debtor_member_id: {type: string, format: uuid}
        creditor_member_id: {type: string, format: uuid}
        total_amount: {type: string}
        debt_count: {type: integer, format: int64, minimum: 1}
    DebtPage:
      type: object
      required: [debts, net_matrix, caller_payable, caller_receivable, next_cursor]
      properties:
        debts: {type: array, items: {$ref: "#/components/schemas/Debt"}}
        net_matrix: {type: array, items: {$ref: "#/components/schemas/DebtMatrixEntry"}}
        caller_payable: {type: string}
        caller_receivable: {type: string}
        next_cursor: {type: string, nullable: true}
    Password:
      type: string
      minLength: 8
      maxLength: 72
      description: 8 to 72 bytes with lowercase, uppercase, and a digit
    SignUpRequest:
      type: object
      required: [email, phone_number, display_name, password]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254}
        phone_number: {type: string, description: Vietnamese local input or E.164}
        display_name: {type: string, minLength: 1, maxLength: 100}
        password: {$ref: "#/components/schemas/Password"}
    SignInRequest:
      type: object
      required: [email, password, device_id]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, maxLength: 72}
        device_id: {type: string, format: uuid}
        device_name: {type: string, maxLength: 120}
    User:
      type: object
      required: [id, email, phone_number, display_name, role, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        phone_number: {type: string}
        display_name: {type: string}
        role: {type: string, enum: [user, admin]}
        status: {type: string, enum: [pending_verification, active, suspended, locked]}
        email_verified_at: {type: string, format: date-time, nullable: true}
        bank_code: {type: string, nullable: true}
        bank_account_number: {type: string, nullable: true}
        bank_account_holder: {type: string, nullable: true}
        avatar_url: {type: string, format: uri, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SignUpResponse:
      type: object
      required: [user, verification_email_sent, verification_expires_at]
      properties:
        user: {$ref: "#/components/schemas/User"}
        verification_email_sent: {type: boolean}
        verification_expires_at: {type: string, format: date-time}
    TokenPair:
      type: object
      required: [token_type, access_token, access_token_expires_at, refresh_token, refresh_token_expires_at]
      properties:
        token_type: {type: string, enum: [Bearer]}
        access_token: {type: string}
        access_token_expires_at: {type: string, format: date-time}
        refresh_token: {type: string}
        refresh_token_expires_at: {type: string, format: date-time}
    SignInResponse:
      allOf:
        - {$ref: "#/components/schemas/TokenPair"}
        - type: object
          required: [user]
          properties: {user: {$ref: "#/components/schemas/User"}}
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string, minLength: 1, maxLength: 100}
        phone_number: {type: string}
        bank_code: {type: string, nullable: true}
        bank_account_number: {type: string, pattern: "^[0-9]{6,19}$", nullable: true}
        bank_account_holder: {type: string, minLength: 1, maxLength: 100, nullable: true}
    Notification:
      type: object
      required: [id, user_id, type, title, body, created_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        type: {type: string}
        title: {type: string}
        body: {type: string}
        payload: {type: object, nullable: true}
        read_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
    PaginationMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page: {type: integer}
        page_size: {type: integer}
        total_items: {type: integer, format: int64}
        total_pages: {type: integer}
    PaginatedNotifications:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Notification"}
        meta: {$ref: "#/components/schemas/PaginationMeta"}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            fields: {type: object, additionalProperties: {type: string}}
    OpenDebtsError:
      description: Error variant for GROUP_MEMBER_HAS_OPEN_DEBTS, carrying the target's outstanding amounts
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields]
          properties:
            code: {type: string, enum: [GROUP_MEMBER_HAS_OPEN_DEBTS]}
            message: {type: string}
            fields:
              type: object
              required: [payable_amount, receivable_amount]
              properties:
                payable_amount: {type: string, description: Decimal VND string the target still owes others}
                receivable_amount: {type: string, description: Decimal VND string others still owe the target}
    CreateGroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Trimmed to 1-100 Unicode code points}
        currency: {type: string, enum: [VND], description: Optional; only VND is accepted in v1}
    Group:
      type: object
      required: [id, name, currency, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        currency: {type: string, enum: [VND]}
        created_at: {type: string, format: date-time}
    Membership:
      type: object
      required: [id, group_id, user_id, role, status, joined_at, left_at]
      properties:
        id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        role: {type: string, enum: [captain, member]}
        status: {type: string, enum: [active, inactive]}
        joined_at: {type: string, format: date-time}
        left_at: {type: string, format: date-time, nullable: true}
    Member:
      type: object
      required: [membership_id, user_id, display_name, avatar_url, role, joined_at]
      properties:
        membership_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        avatar_url: {type: string, format: uri, nullable: true}
        role: {type: string, enum: [captain, member]}
        joined_at: {type: string, format: date-time}
    Balance:
      type: object
      required: [member_id, net_balance]
      properties:
        member_id: {type: string, format: uuid}
        net_balance: {type: string, description: Decimal VND string; positive means the member is owed}
    GroupListItem:
      type: object
      required: [group, caller_membership_id, caller_role, active_member_count]
      properties:
        group: {$ref: "#/components/schemas/Group"}
        caller_membership_id: {type: string, format: uuid}
        caller_role: {type: string, enum: [captain, member]}
        active_member_count: {type: integer}
    CreateGroupResponse:
      type: object
      required: [group, membership]
      properties:
        group: {$ref: "#/components/schemas/Group"}
        membership: {$ref: "#/components/schemas/Membership"}
    GroupListResponse:
      type: object
      required: [groups, next_cursor]
      properties:
        groups: {type: array, items: {$ref: "#/components/schemas/GroupListItem"}}
        next_cursor: {type: string, nullable: true}
    GroupDetailResponse:
      type: object
      required: [group, members, balances, caller_role]
      properties:
        group: {$ref: "#/components/schemas/Group"}
        members: {type: array, items: {$ref: "#/components/schemas/Member"}}
        balances: {type: array, items: {$ref: "#/components/schemas/Balance"}}
        caller_role: {type: string, enum: [captain, member]}
    CreateInviteRequest:
      type: object
      additionalProperties: false
      properties:
        expires_in_hours: {type: integer, minimum: 1, maximum: 168, default: 24}
        max_uses: {type: integer, minimum: 1, maximum: 50, nullable: true, description: Optional; unlimited when omitted}
        regenerate: {type: boolean, default: false, description: Revoke every available invite first and create one new one}
    Invite:
      type: object
      required: [id, code, invite_url, expires_at, max_uses, use_count]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, description: Sensitive; only ever returned by create or reuse}
        invite_url: {type: string, description: APP_INVITE_BASE_URL plus the encoded invite code}
        expires_at: {type: string, format: date-time}
        max_uses: {type: integer, nullable: true}
        use_count: {type: integer}
    InviteResponse:
      type: object
      required: [invite]
      properties:
        invite: {$ref: "#/components/schemas/Invite"}
    InvitePreview:
      type: object
      required: [group_name, active_member_count, captain_display_name]
      properties:
        group_name: {type: string}
        active_member_count: {type: integer}
        captain_display_name: {type: string}
    InvitePreviewResponse:
      type: object
      required: [preview]
      properties:
        preview: {$ref: "#/components/schemas/InvitePreview"}
    JoinGroupRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: {type: string}
    JoinResult:
      type: object
      required: [group_id, membership_id, role, status, result]
      properties:
        group_id: {type: string, format: uuid}
        membership_id: {type: string, format: uuid}
        role: {type: string, enum: [captain, member]}
        status: {type: string, enum: [active, inactive]}
        result: {type: string, enum: [joined, reactivated, already_active]}
    JoinGroupResponse:
      type: object
      required: [join]
      properties:
        join: {$ref: "#/components/schemas/JoinResult"}
    TransferRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: {type: string, enum: [captain]}
    CaptainTransfer:
      type: object
      required: [previous_captain_member_id, current_captain_member_id]
      properties:
        previous_captain_member_id: {type: string, format: uuid}
        current_captain_member_id: {type: string, format: uuid}
    CaptainTransferResponse:
      type: object
      required: [transfer]
      properties:
        transfer: {$ref: "#/components/schemas/CaptainTransfer"}
    ActivityActor:
      type: object
      required: [member_id, user_id, display_name, avatar_url]
      properties:
        member_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        avatar_url: {type: string, format: uri, nullable: true}
    Activity:
      type: object
      required: [id, action_type, description, actor, metadata, created_at]
      properties:
        id: {type: string, format: uuid}
        action_type:
          type: string
          enum: [group_created, invite_created, invite_revoked, member_joined, member_reactivated, member_left, member_removed, captain_transferred]
        description: {type: string}
        actor: {$ref: "#/components/schemas/ActivityActor"}
        metadata: {type: object, description: "Exact keys per action_type; never includes an invite code"}
        created_at: {type: string, format: date-time}
    ActivityListResponse:
      type: object
      required: [activities, next_cursor]
      properties:
        activities: {type: array, items: {$ref: "#/components/schemas/Activity"}}
        next_cursor: {type: string, nullable: true}
    Bank:
      type: object
      required: [name, code, bin, short_name, supported]
      properties:
        id: {type: integer, nullable: true}
        name: {type: string}
        code: {type: string}
        bin: {type: string}
        short_name: {type: string}
        logo: {type: string, format: uri, nullable: true}
        supported: {type: boolean}
    BankListResponse:
      type: object
      required: [banks]
      properties:
        banks: {type: array, items: {$ref: "#/components/schemas/Bank"}}

    Bill:
      type: object
      required: [id, group_id, creditor_member_id, status, subtotal, service_charge, vat, discount, total, version]
      properties:
        id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        creditor_member_id: {type: string, format: uuid}
        status: {type: string, enum: [draft, reviewed, finalized, voided]}
        merchant_name: {type: string, nullable: true}
        bill_date: {type: string, format: date-time, nullable: true}
        subtotal: {type: integer, format: int64}
        service_charge: {type: integer, format: int64}
        vat: {type: integer, format: int64}
        discount: {type: integer, format: int64, description: "Tổng giảm giá = total_item_discount + general_discount"}
        total_item_discount: {type: integer, format: int64, description: "Tổng khuyến mãi gắn theo từng món"}
        general_discount: {type: integer, format: int64, description: "Giảm giá chung/voucher của cả hóa đơn"}
        total: {type: integer, format: int64}
        split_method: {type: string, enum: [even, item_ratio, exact, shares, percentage]}
        mismatch_codes:
          type: array
          items:
            type: string
            enum: [OCR_DATE_AMBIGUOUS, LOW_CONFIDENCE, SUBTOTAL_MISMATCH, TOTAL_MISMATCH, ITEM_UNASSIGNED, INACTIVE_MEMBER_ASSIGNED, DISCOUNT_EXCEEDS_BILL, DISCOUNT_NOT_ALLOCATABLE, CREDITOR_REQUIRED]
          description: >-
            Stable blocker codes. On a bill detail read of a draft or reviewed bill these are
            recomputed at read time and merged with any stored OCR warnings, so the client learns
            why `breakdown` is absent instead of seeing an unexplained empty response. A non empty
            list means review and finalize will be refused until it clears.
        replaces_bill_id: {type: string, format: uuid, nullable: true}
        version: {type: integer}
        finalized_at: {type: string, format: date-time, nullable: true}
        voided_at: {type: string, format: date-time, nullable: true}
        reviewed_at: {type: string, format: date-time, nullable: true}
        reviewed_by_member_id: {type: string, format: uuid, nullable: true}
        images: {type: array, items: {$ref: "#/components/schemas/BillImage"}}
        items: {type: array, items: {$ref: "#/components/schemas/BillItem"}}
        shares: {type: array, items: {$ref: "#/components/schemas/BillShare"}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    BillImage:
      type: object
      required: [id, bill_id, image_key, position]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        image_key: {type: string}
        position: {type: integer}
        created_at: {type: string, format: date-time}

    BillItem:
      type: object
      required: [id, bill_id, name, quantity, unit_price, line_total, position]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        name: {type: string}
        quantity: {type: string}
        unit_price: {type: integer, format: int64}
        line_total: {type: integer, format: int64}
        discount_amount: {type: integer, format: int64, description: "Khuyến mãi riêng cho món này (VND)"}
        final_price: {type: integer, format: int64, description: "line_total trừ discount_amount, dùng để chia cho thành viên"}
        position: {type: integer}
        assignments: {type: array, items: {$ref: "#/components/schemas/BillItemAssignment"}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    BillItemAssignment:
      type: object
      required: [id, bill_item_id, member_id, weight]
      properties:
        id: {type: string, format: uuid}
        bill_item_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        member_id: {type: string, format: uuid}
        weight: {type: string}
        created_at: {type: string, format: date-time}

    BillShare:
      type: object
      required: [id, bill_id, member_id, final_amount]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        member_id: {type: string, format: uuid}
        item_subtotal: {type: integer, format: int64}
        service_charge_share: {type: integer, format: int64}
        vat_share: {type: integer, format: int64}
        discount_share: {type: integer, format: int64}
        rounding_adjustment:
          type: integer
          format: int64
          description: >-
            Zero for every member except the Creditor. For the Creditor it is the residual left after
            floor allocation, the capped discount cascade, and the Creditor reconciliation, so it can
            be negative when discount remainders dominate.
        final_amount: {type: integer, format: int64}
        created_at: {type: string, format: date-time}

    MemberAllocation:
      type: object
      required: [member_id, item_subtotal, service_charge_share, vat_share, discount_share, final_amount]
      properties:
        member_id: {type: string, format: uuid}
        item_subtotal: {type: integer, format: int64}
        service_charge_share: {type: integer, format: int64}
        vat_share: {type: integer, format: int64}
        discount_share: {type: integer, format: int64}
        rounding_adjustment:
          type: integer
          format: int64
          description: >-
            Zero for every member except the Creditor. For the Creditor it is the residual left after
            floor allocation, the capped discount cascade, and the Creditor reconciliation, so it can
            be negative when discount remainders dominate.
        final_amount: {type: integer, format: int64}

    OCRJob:
      type: object
      required: [id, bill_id, status, provider, attempts, version]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, processing, succeeded, failed]}
        provider: {type: string}
        attempts: {type: integer}
        candidate: {type: object}
        error_message: {type: string, nullable: true}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}
