        không đổi; sau khi cutover hoàn tất, endpoint này sẽ trả 410 với body
        `STREAM_REPLACED` mô tả bên dưới.
      deprecated: true
      operationId: streamBillEvents
      tags: [Bills]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "410": {$ref: "#/components/responses/StreamReplaced"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/bills/{id}/ocr-retry:
    post:
      summary: Retry OCR extraction for bill images
      operationId: retryOCR
      tags: [Bills]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "202":
          description: OCR retry queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ocr_job: {$ref: "#/components/schemas/OCRJob"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: "OCR job already running (OCR_ALREADY_RUNNING)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "429":
          description: "Manual OCR retry limit reached (OCR_LIMIT_REACHED)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "502":
          description: "OCR provider returned a malformed result (OCR_SCHEMA_INVALID)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "503":
          description: "OCR provider unavailable (OCR_PROVIDER_UNAVAILABLE)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "504":
          description: "OCR provider timed out (OCR_TIMEOUT)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/v1/bills/{id}/apply-candidate:
    post:
      summary: Apply OCR candidate to draft bill
      operationId: applyCandidate
      tags: [Bills]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id, version]
              properties:
                job_id: {type: string, format: uuid}
                version: {type: integer}
      responses:
        "200":
          description: Draft updated with OCR candidate
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: "OCR job not found (OCR_JOB_NOT_FOUND)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: "Stale bill version (VERSION_CONFLICT), the OCR job result is stale relative to the draft (OCR_RESULT_STALE), the job's candidate was already applied (OCR_ALREADY_APPLIED), or the job is not finished yet (OCR_NOT_READY)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: "OCR candidate failed validation (OCR_CANDIDATE_INVALID)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/v1/bills/{id}/calculate:
    post:
      summary: Preview and calculate provisional bill breakdown for an existing bill
      operationId: calculateExistingBillBreakdown
      tags: [Bills]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: false
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creditor_member_id]
              properties:
                group_id: {type: string, format: uuid}
                creditor_member_id: {type: string, format: uuid}
                subtotal: {type: integer, minimum: 0}
                service_charge: {type: integer, minimum: 0}
                vat: {type: integer, minimum: 0}
                discount: {type: integer, minimum: 0}
                total: {type: integer, minimum: 0}
                split_method:
                  type: string
                  enum: [item_ratio, even]
                items:
                  type: array
                  items: {$ref: "#/components/schemas/CreateBillItemRequest"}
      responses:
        "200":
          description: "Calculation succeeded"
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, example: true}
                  message: {type: string, example: "Thành công"}
                  data:
                    type: object
                    required: [total, is_balanced, breakdown]
                    properties:
                      total: {type: integer, example: 760000}
                      is_balanced: {type: boolean, example: true}
                      breakdown:
                        type: array
                        items: {$ref: "#/components/schemas/MemberAllocation"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/bills/{id}/review:
    post:
      summary: Mark a reconciled draft bill as reviewed
      operationId: reviewBill
      tags: [Bills]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer}
      responses:
        "200":
          description: Bill reviewed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: "Stale version (VERSION_CONFLICT)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: "Bill has unresolved mismatches, is not in a reviewable state, or has no Creditor (BILL_NOT_READY), or the discount cannot be allocated across the assigned members (DISCOUNT_NOT_ALLOCATABLE)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/v1/bills/{id}/finalize:
    post:
      summary: Finalize a reviewed bill into immutable shares and debts
      operationId: finalizeBill
      tags: [Bills]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer}
      responses:
        "200":
          description: Bill finalized
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: "Stale version (VERSION_CONFLICT)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: "Creditor has no bank account on file (BANK_ACCOUNT_REQUIRED), the bill has not been reviewed yet (BILL_NOT_READY), or the discount is valid in total but concentrated on members who cannot absorb it so the cascade drives the Creditor below zero (DISCOUNT_NOT_ALLOCATABLE)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/v1/bills/{id}/void:
    post:
      summary: Void an unpaid finalized bill
      operationId: voidBill
      tags: [Bills]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: group_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version: {type: integer}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        "200":
          description: Bill voided
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          bill: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: "Bill already voided (BILL_ALREADY_VOIDED), or a payment for this bill has already started (PAYMENT_ALREADY_STARTED)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/v1/groups/{groupId}/expenses/me:
    get:
      operationId: getMyGroupExpenses
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: Personal finalized bill allocations, content: {application/json: {schema: {allOf: [{$ref: "#/components/schemas/SuccessEnvelope"}, {type: object, properties: {data: {$ref: "#/components/schemas/ExpensePage"}}}]}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/groups/{groupId}/debts:
    get:
      operationId: listGroupDebts
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
        - {name: debtor_member_id, in: query, schema: {type: string, format: uuid}}
        - {name: creditor_member_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [awaiting, pending_confirmation, settled]}}
      responses:
        "200": {description: Filtered debts plus unfiltered group totals, content: {application/json: {schema: {allOf: [{$ref: "#/components/schemas/SuccessEnvelope"}, {type: object, properties: {data: {$ref: "#/components/schemas/DebtPage"}}}]}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/groups/{groupId}/debts/{debtId}/remind:
    post:
      operationId: remindDebt
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {name: debtId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200": {description: Reminder claimed, content: {application/json: {schema: {allOf: [{$ref: "#/components/schemas/SuccessEnvelope"}, {type: object, properties: {data: {$ref: "#/components/schemas/ReminderResult"}}}]}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/groups/{groupId}/payments/qr:
    post:
      operationId: generatePaymentQR
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/GeneratePaymentRequest"}}}}
      responses:
        "200": {description: Matching pending payment replayed, content: {application/json: {schema: {allOf: [{$ref: "#/components/schemas/SuccessEnvelope"}, {type: object, properties: {data: {$ref: "#/components/schemas/PaymentEnvelope"}}}]}}}}
        "201": {description: Payment created, content: {application/json: {schema: {allOf: [{$ref: "#/components/schemas/SuccessEnvelope"}, {type: object, properties: {data: {$ref: "#/components/schemas/PaymentEnvelope"}}}]}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
  /api/v1/groups/{groupId}/payments/{paymentId}:
    get:
      operationId: getPayment
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/PaymentId"}
      responses:
        "200": {description: Payment detail, content: {application/json: {schema: {allOf: [{$ref: "#/components/schemas/SuccessEnvelope"}, {type: object, properties: {data: {$ref: "#/components/schemas/PaymentEnvelope"}}}]}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
  /api/v1/groups/{groupId}/payments/{paymentId}/proof:
    post:
      operationId: submitPaymentProof
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/PaymentId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties: {image: {type: string, format: binary}, note: {type: string, maxLength: 500}}
      responses:
        "200": {description: Proof accepted, content: {application/json: {schema: {allOf: [{$ref: "#/components/schemas/SuccessEnvelope"}, {type: object, properties: {data: {$ref: "#/components/schemas/PaymentEnvelope"}}}]}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "503": {description: Private storage unavailable}
  /api/v1/groups/{groupId}/payments/{paymentId}/confirm:
    post:
      operationId: confirmPayment
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/PaymentId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200": {description: Payment and every covered debt settled, content: {application/json: {schema: {allOf: [{$ref: "#/components/schemas/SuccessEnvelope"}, {type: object, properties: {data: {$ref: "#/components/schemas/PaymentMutationEnvelope"}}}]}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/groups/{groupId}/payments/{paymentId}/reject:
    post:
      operationId: rejectPayment
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
        - {$ref: "#/components/parameters/PaymentId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 500}}}}}}
      responses:
        "200": {description: Payment rejected and covered debts reset, content: {application/json: {schema: {allOf: [{$ref: "#/components/schemas/SuccessEnvelope"}, {type: object, properties: {data: {$ref: "#/components/schemas/PaymentMutationEnvelope"}}}]}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/admin/accounts:
    get:
      summary: List user accounts with search, filter, sort, and pagination
      operationId: listAccounts
      tags: [Admin]
      security: [{bearerAuth: []}]
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, default: 20}
        - name: status
          in: query
          schema: {type: string, enum: [pending_verification, active, suspended, locked]}
        - name: role
          in: query
          schema: {type: string, enum: [user, admin]}
        - name: search
          in: query
          schema: {type: string}
          description: Matches email, display name, or phone number
        - name: sort_by
          in: query
          schema: {type: string}
        - name: sort_order
          in: query
          schema: {type: string, enum: [asc, desc]}
      responses:
        "200":
          description: Paginated list of accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/ListAccountsResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/admin/accounts/{id}:
    get:
      summary: Get full account detail for admin review
      operationId: getAccountDetail
      tags: [Admin]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Account detail with bank info, sessions, groups, financials, and recent audit logs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/AccountDetailResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: "Account not found (ACCOUNT_NOT_FOUND)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/v1/admin/accounts/{id}/status:
    put:
      summary: Update an account's status (suspend, lock, reactivate)
      operationId: updateAccountStatus
      tags: [Admin]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              additionalProperties: false
              properties:
                status: {type: string, enum: [pending_verification, active, suspended, locked]}
                reason: {type: string, minLength: 1}
      responses:
        "200":
          description: Status updated; warning flags any unsettled debts/credits the target still has
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/UpdateStatusResponse"}
        "400":
          description: "Validation failed (VALIDATION_FAILED), or invalid status transition (INVALID_STATUS_TRANSITION)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: "Insufficient permissions (INSUFFICIENT_PERMISSIONS), cannot modify own account (CANNOT_MODIFY_SELF), or cannot modify another admin account (CANNOT_MODIFY_ADMIN)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: "Account not found (ACCOUNT_NOT_FOUND)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/v1/admin/system/overview:
    get:
      summary: Aggregate system health and business metrics
      operationId: getSystemOverview
      tags: [Admin]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Counts across users, groups, bills, debts, media cleanup, OCR jobs, and runtime stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/SystemOverviewResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    GroupId: {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
    PaymentId: {name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1}}
  requestBodies:
    VerifyEmail:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, otp]
            additionalProperties: false
            properties:
              email: {type: string, format: email, maxLength: 254}
              otp: {type: string, pattern: '^[0-9]{6}$', minLength: 6, maxLength: 6}
    Email:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            additionalProperties: false
            properties: {email: {type: string, format: email, maxLength: 254}}
  responses:
    BadRequest:
      description: Validation or invalid token error
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unauthorized:
      description: Authentication or session error
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Forbidden:
      description: Account is not eligible
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Conflict:
      description: Unique email or phone conflict
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotFound:
      description: Resource missing, or the caller is not authorized to see it
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    UnprocessableEntity:
      description: The request is valid but required business data is incomplete
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    CaptainRequired:
      description: Caller is not the group's active Captain
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    InviteNotFound:
      description: Invite is malformed, unknown, expired, revoked, or exhausted; every unusable state returns INVITE_NOT_FOUND
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    GroupHasUnsettledObligations:
      description: Group has bills outside finalized or voided, or debts outside settled or voided
      content: {application/json: {schema: {$ref: "#/components/schemas/GroupUnsettledObligationsError"}}}
    GroupMemberLimitReached:
      description: Group already has 50 active members
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    RateLimited:
      description: Rolling limit exceeded
      headers:
        Retry-After: {schema: {type: integer}, description: Seconds until retry}
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    StreamReplaced:
      description: |
        Endpoint stream legacy đã ngừng phục vụ sau khi cutover hoàn tất. Chưa
        được trả về ở phiên bản hiện tại; ghi ở đây để client sinh tự động xử lý
        được ngay từ bây giờ. `error.details.replacement` là đường dẫn thay thế.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    type: object
                    required: [code, message, details]
                    properties:
                      code: {type: string, enum: [STREAM_REPLACED]}
                      message: {type: string}
                      details:
                        type: object
                        required: [replacement]
                        properties:
                          replacement:
                            type: string
                            example: /api/v1/users/me/events
    EmailAccepted:
      description: Generic response that does not reveal account existence. The human-readable message is carried at the envelope's top-level "message", not inside "data".
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data: {nullable: true}
  schemas:
    GeneratePaymentRequest:
      type: object
      required: [creditor_member_id]
      properties:
        creditor_member_id: {type: string, format: uuid}
        debt_ids: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
    RecipientBank:
      type: object
      required: [bank_code, bank_name, account_number, account_holder]
      properties:
        bank_code: {type: string, description: VietQR bank BIN}
        bank_name: {type: string}
        account_number: {type: string}
        account_holder: {type: string}
    Payment:
      type: object
      required: [id, group_id, debtor_member_id, creditor_member_id, amount, reference_code, status, covered_debt_ids, created_at]
      properties:
        id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        debtor_member_id: {type: string, format: uuid}
        creditor_member_id: {type: string, format: uuid}
        amount: {type: string, pattern: '^[0-9]+$'}
        reference_code: {type: string, pattern: '^PAY[A-HJ-NP-Z2-9]{8}$'}
        status: {type: string, enum: [pending_proof, pending_confirmation, confirmed, rejected, superseded]}
        qr_payload: {type: string, nullable: true}
        qr_image_url: {type: string, format: uri, nullable: true}
        recipient: {allOf: [{$ref: "#/components/schemas/RecipientBank"}], nullable: true}
        image_url: {type: string, format: uri, nullable: true}
        note: {type: string, nullable: true}
        rejection_reason: {type: string, nullable: true}
        covered_debt_ids: {type: array, items: {type: string, format: uuid}}
        created_at: {type: string, format: date-time}
        submitted_at: {type: string, format: date-time, nullable: true}
        confirmed_at: {type: string, format: date-time, nullable: true}
        rejected_at: {type: string, format: date-time, nullable: true}
    PaymentEnvelope:
      type: object
      required: [payment]
      properties: {payment: {$ref: "#/components/schemas/Payment"}}
    PaymentMutationEnvelope:
      type: object
      required: [payment]
      properties:
        payment: {$ref: "#/components/schemas/Payment"}
        settled_debts: {type: array, items: {type: string, format: uuid}}
        reset_debts: {type: array, items: {type: string, format: uuid}}
    ReminderResult:
      type: object
      required: [debt_id, reminder_count, reminded_at]
      properties: {debt_id: {type: string, format: uuid}, reminder_count: {type: integer, minimum: 1, maximum: 3}, reminded_at: {type: string, format: date-time}}
    ExpenseItem:
      type: object
      required: [item_name, quantity, unit_price, line_total, item_discount_amount, item_final_price, share_ratio, item_share]
      properties:
        item_name: {type: string}
        quantity: {type: string}
        unit_price: {type: string}
        line_total: {type: string}
        item_discount_amount: {type: string}
        item_final_price: {type: string}
        share_ratio: {type: string}
        item_share: {type: string}
    ExpenseAllocation:
      type: object
      required: [item_subtotal, service_charge_share, vat_share, discount_share, rounding_adjustment, final_amount]
      properties:
        item_subtotal: {type: string, description: "Floor of the member exact item shares after aggregation across all participated items. Nested item_share values reconcile to this amount."}
        service_charge_share: {type: string}
        vat_share: {type: string}
        discount_share: {type: string}
        rounding_adjustment: {type: string, description: "final_amount - (item_subtotal + service_charge_share + vat_share - discount_share). It can belong to any member."}
        final_amount: {type: string}
    ExpenseBill:
      type: object
      required: [bill_id, bill_date, merchant_name, creditor_member_id, creditor_display_name, debt_id, debt_status, allocation, items]
      properties:
        bill_id: {type: string, format: uuid}
        bill_date: {type: string, format: date}
        merchant_name: {type: string}
        creditor_member_id: {type: string, format: uuid}
        creditor_display_name: {type: string}
        debt_id: {type: string, format: uuid, nullable: true}
        debt_status: {type: string, enum: [awaiting, pending_confirmation, settled, voided], nullable: true}
        allocation: {$ref: "#/components/schemas/ExpenseAllocation"}
        items: {type: array, items: {$ref: "#/components/schemas/ExpenseItem"}}
    ExpensePage:
      type: object
      required: [summary, bills, next_cursor]
      properties:
        summary:
          type: object
          required: [total_owed, total_settled, total_receivable, net_balance]
          properties: {total_owed: {type: string}, total_settled: {type: string}, total_receivable: {type: string}, net_balance: {type: string}}
        bills: {type: array, items: {$ref: "#/components/schemas/ExpenseBill"}}
        next_cursor: {type: string, nullable: true}
    Debt:
      type: object
      required: [id, bill_id, bill_date, merchant_name, debtor_member_id, debtor_display_name, debtor_avatar_url, creditor_member_id, creditor_display_name, creditor_avatar_url, amount, status, reminder_count, payment_id, created_at, settled_at]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        bill_date: {type: string, format: date}
        merchant_name: {type: string}
        debtor_member_id: {type: string, format: uuid}
        debtor_display_name: {type: string}
        debtor_avatar_url: {type: string, format: uri, nullable: true}
        creditor_member_id: {type: string, format: uuid}
        creditor_display_name: {type: string}
        creditor_avatar_url: {type: string, format: uri, nullable: true}
        amount: {type: string}
        status: {type: string, enum: [awaiting, pending_confirmation, settled, voided]}
        reminder_count: {type: integer, minimum: 0, maximum: 3}
        payment_id: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}
        settled_at: {type: string, format: date-time, nullable: true}
    DebtMatrixEntry:
      type: object
      required: [debtor_member_id, creditor_member_id, total_amount, debt_count]
      properties:
        debtor_member_id: {type: string, format: uuid}
        creditor_member_id: {type: string, format: uuid}
        total_amount: {type: string}
        debt_count: {type: integer, format: int64, minimum: 1}
    DebtPage:
      type: object
      required: [debts, net_matrix, caller_payable, caller_receivable, next_cursor]
      properties:
        debts: {type: array, items: {$ref: "#/components/schemas/Debt"}}
        net_matrix: {type: array, items: {$ref: "#/components/schemas/DebtMatrixEntry"}}
        caller_payable: {type: string}
        caller_receivable: {type: string}
        next_cursor: {type: string, nullable: true}
    Password:
      type: string
      minLength: 8
      maxLength: 72
      description: 8 to 72 bytes with lowercase, uppercase, and a digit
    SignUpRequest:
      type: object
      required: [email, phone_number, display_name, password]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254}
        phone_number: {type: string, description: Vietnamese local input or E.164}
        display_name: {type: string, minLength: 1, maxLength: 100}
        password: {$ref: "#/components/schemas/Password"}
    SignInRequest:
      type: object
      required: [email, password, device_id]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, maxLength: 72}
        device_id: {type: string, format: uuid}
        device_name: {type: string, maxLength: 120}
    User:
      type: object
      required: [id, email, phone_number, display_name, role, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        phone_number: {type: string}
        display_name: {type: string}
        role: {type: string, enum: [user, admin]}
        status: {type: string, enum: [pending_verification, active, suspended, locked]}
        email_verified_at: {type: string, format: date-time, nullable: true}
        bank_code: {type: string, nullable: true}
        bank_account_number: {type: string, nullable: true}
        bank_account_holder: {type: string, nullable: true}
        avatar_url: {type: string, format: uri, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SignUpResponse:
      type: object
      required: [user, verification_email_sent, verification_expires_at]
      properties:
        user: {$ref: "#/components/schemas/User"}
        verification_email_sent: {type: boolean}
        verification_expires_at: {type: string, format: date-time}
    TokenPair:
      type: object
      required: [token_type, access_token, access_token_expires_at, refresh_token, refresh_token_expires_at]
      properties:
        token_type: {type: string, enum: [Bearer]}
        access_token: {type: string}
        access_token_expires_at: {type: string, format: date-time}
        refresh_token: {type: string}
        refresh_token_expires_at: {type: string, format: date-time}
    SignInResponse:
      allOf:
        - {$ref: "#/components/schemas/TokenPair"}
        - type: object
          required: [user]
          properties: {user: {$ref: "#/components/schemas/User"}}
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string, minLength: 1, maxLength: 100}
        phone_number: {type: string}
        bank_code: {type: string, nullable: true}
        bank_account_number: {type: string, pattern: "^[0-9]{6,19}$", nullable: true}
        bank_account_holder: {type: string, minLength: 1, maxLength: 100, nullable: true}
    Notification:
      type: object
      required: [id, user_id, type, title, body, created_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        type: {type: string}
        title: {type: string}
        body: {type: string}
        payload: {type: object, nullable: true}
        read_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
    PaginationMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page: {type: integer}
        page_size: {type: integer}
        total_items: {type: integer, format: int64}
        total_pages: {type: integer}
    PaginatedNotifications:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Notification"}
        meta: {$ref: "#/components/schemas/PaginationMeta"}
    SuccessEnvelope:
      description: Standard envelope every non-exempt success response is wrapped in. Concrete operations narrow "data" via allOf.
      type: object
      required: [success, data, message]
      properties:
        success: {type: boolean, enum: [true]}
        data: {}
        message: {type: string}
    Error:
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, enum: [false]}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object, additionalProperties: {type: string}}
    OpenDebtsError:
      description: Error variant for GROUP_MEMBER_HAS_OPEN_DEBTS, carrying the target's outstanding amounts
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, enum: [false]}
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {type: string, enum: [GROUP_MEMBER_HAS_OPEN_DEBTS]}
            message: {type: string}
            details:
              type: object
              required: [payable_amount, receivable_amount]
              properties:
                payable_amount: {type: string, description: Decimal VND string the target still owes others}
                receivable_amount: {type: string, description: Decimal VND string others still owe the target}
    GroupUnsettledObligationsError:
      description: Error variant for GROUP_HAS_UNSETTLED_OBLIGATIONS
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, enum: [false]}
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {type: string, enum: [GROUP_HAS_UNSETTLED_OBLIGATIONS]}
            message: {type: string}
            details:
              type: object
              required: [draft_or_reviewed_bill_count, open_debt_count]
              properties:
                draft_or_reviewed_bill_count: {type: string, pattern: '^[0-9]+$'}
                open_debt_count: {type: string, pattern: '^[0-9]+$'}
    CreateGroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Trimmed to 1-100 Unicode code points}
        currency: {type: string, enum: [VND], description: Optional; only VND is accepted in v1}
    Group:
      type: object
      required: [id, name, currency, created_at, bill_submission_locked]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        currency: {type: string, enum: [VND]}
        created_at: {type: string, format: date-time}
        bill_submission_locked: {type: boolean, description: "True when the Captain has locked new bill submission for this group (spec 0008); the lock is one way in v1"}
        bill_submission_locked_at: {type: string, format: date-time, nullable: true, description: PostgreSQL time recorded when the lock was applied; null while the group is open}
    RenameGroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Trimmed to 1-100 Unicode code points}
    GroupResponse:
      type: object
      required: [group]
      properties:
        group: {$ref: "#/components/schemas/Group"}
    Membership:
      type: object
      required: [id, group_id, user_id, role, status, joined_at, left_at]
      properties:
        id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        role: {type: string, enum: [captain, member]}
        status: {type: string, enum: [active, inactive]}
        joined_at: {type: string, format: date-time}
        left_at: {type: string, format: date-time, nullable: true}
    Member:
      type: object
      required: [membership_id, user_id, display_name, avatar_url, role, joined_at]
      properties:
        membership_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        avatar_url: {type: string, format: uri, nullable: true}
        role: {type: string, enum: [captain, member]}
        joined_at: {type: string, format: date-time}
    Balance:
      type: object
      required: [member_id, net_balance]
      properties:
        member_id: {type: string, format: uuid}
        net_balance: {type: string, description: Decimal VND string; positive means the member is owed}
    GroupListItem:
      type: object
      description: >-
        One group card. Every display field is built in a single query so the
        group list never needs a follow-up GET /groups/{id} per group.
      required: [group, caller_membership_id, caller_role, active_member_count,
                 caller_net_balance, pending_bill_count, last_activity]
      properties:
        group: {$ref: "#/components/schemas/Group"}
        caller_membership_id: {type: string, format: uuid}
        caller_role: {type: string, enum: [captain, member]}
        active_member_count: {type: integer}
        caller_net_balance:
          type: string
          pattern: '^-?[0-9]+$'
          description: >-
            The caller's net VND balance in this group, sent as a string so large
            values survive JSON parsing. Positive means owed to the caller,
            negative means the caller owes, 0 when the group has no open debts.
        pending_bill_count:
          type: integer
          description: Bills that are neither finalized nor voided, the same definition the disband guard uses
        last_activity:
          nullable: true
          description: The group's most recent activity; null when the group has none
          allOf: [{$ref: "#/components/schemas/ActivitySummary"}]
    ActivitySummary:
      type: object
      required: [description, created_at]
      properties:
        description: {type: string, description: Vietnamese description already rendered by the backend}
        created_at: {type: string, format: date-time}
    CreateGroupResponse:
      type: object
      required: [group, membership]
      properties:
        group: {$ref: "#/components/schemas/Group"}
        membership: {$ref: "#/components/schemas/Membership"}
    GroupListResponse:
      type: object
      required: [groups, next_cursor]
      properties:
        groups: {type: array, items: {$ref: "#/components/schemas/GroupListItem"}}
        next_cursor: {type: string, nullable: true}
    GroupDetailResponse:
      type: object
      required: [group, members, balances, caller_role, caller_membership_id, version, pending_bill_count]
      properties:
        group: {$ref: "#/components/schemas/Group"}
        members: {type: array, items: {$ref: "#/components/schemas/Member"}}
        balances: {type: array, items: {$ref: "#/components/schemas/Balance"}}
        caller_role: {type: string, enum: [captain, member]}
        pending_bill_count: {type: integer, minimum: 0, description: "Hóa đơn chưa chốt (status ngoài finalized và voided). Cùng định nghĩa với trường cùng tên trong danh sách nhóm, để client làm mới một thẻ nhóm tại chỗ mà không phải tải lại cả trang danh sách."}
        caller_membership_id: {type: string, format: uuid, description: "membership_id của chính người gọi, để client đánh dấu \"tôi\" trong members mà không phải suy từ vai trò"}
        version: {type: integer, format: int64, minimum: 0, description: "roster_version của nhóm tại thời điểm đọc. Client lưu lại làm điểm xuất phát cho /events và /sync; danh sách members trong cùng response là trạng thái tại đúng version này."}
        active_bill_finalize_batch_id: {type: string, format: uuid, description: "Captain only: ID of the queued or processing bulk finalize batch; omitted for ordinary members (spec 0008)"}
        latest_bill_finalize_batch_id: {type: string, format: uuid, description: "Captain only: newest batch by (created_at, id); omitted for ordinary members"}
    GroupSyncEvent:
      type: object
      required: [version, type, data, created_at]
      properties:
        version: {type: integer, format: int64, minimum: 1, description: Thứ tự đơn điệu tăng trong phạm vi một nhóm, liền mạch và đúng thứ tự commit}
        type:
          type: string
          enum: [member_joined, member_reactivated, member_left, member_removed, captain_transferred, group_renamed, group_archived]
        data:
          type: object
          description: |
            Payload phụ thuộc type. member_joined/member_reactivated mang
            {member, active_member_count}; member_left/member_removed mang
            {membership_id, user_id, actor_membership_id, active_member_count};
            captain_transferred mang {previous_captain_membership_id,
            current_captain_membership_id}; group_renamed mang {old_name, name}.
            Có thể là object rỗng khi envelope bị cắt vì vượt giới hạn payload
            của kênh đẩy — khi đó client gọi /sync để lấy nội dung đầy đủ.
        created_at: {type: string, format: date-time}
    GroupSyncResponse:
      type: object
      required: [version, mode]
      properties:
        version: {type: integer, format: int64, minimum: 0, description: Version client nên lưu lại sau khi áp xong response này}
        mode: {type: string, enum: [delta, snapshot]}
        events:
          type: array
          description: Chỉ có khi mode=delta. Sắp xếp theo version tăng dần, liền mạch từ since+1.
          items: {$ref: "#/components/schemas/GroupSyncEvent"}
        snapshot:
          allOf:
            - $ref: "#/components/schemas/GroupDetailResponse"
          description: Chỉ có khi mode=snapshot. Client thay toàn bộ state cục bộ bằng nội dung này.
    LockSubmissionsResponse:
      type: object
      required: [bill_submission_locked, bill_submission_locked_at]
      properties:
        bill_submission_locked: {type: boolean}
        bill_submission_locked_at: {type: string, format: date-time}
    BulkFinalizeBatch:
      type: object
      required: [id, group_id, requested_by_member_id, status, target_count, finalized_count, failed_count, created_at]
      properties:
        id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        requested_by_member_id: {type: string, format: uuid, description: Audit actor who started the batch; completion notification goes to the current active Captain instead}
        status: {type: string, enum: [queued, processing, completed]}
        target_count: {type: integer, minimum: 0}
        finalized_count: {type: integer, minimum: 0}
        failed_count: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        completed_at: {type: string, format: date-time, nullable: true}
    BulkFinalizeItem:
      type: object
      required: [bill_id, bill_version, captured_reviewed, status]
      properties:
        bill_id: {type: string, format: uuid}
        bill_display_name: {type: string, nullable: true, description: Current merchant name when the bill row still exists; null after a hard delete}
        bill_version: {type: integer, description: Version captured at batch start; the exact version rules of spec 0003 apply to this version}
        captured_reviewed: {type: boolean, description: Whether the captured version was reviewed at capture time}
        status: {type: string, enum: [pending, finalized, failed]}
        error_code: {type: string, nullable: true, description: "Stable redacted code: BILL_DELETED, VERSION_CONFLICT, BILL_ALREADY_VOIDED, BILL_NOT_READY, DISCOUNT_NOT_ALLOCATABLE, or BANK_ACCOUNT_REQUIRED"}
        processed_at: {type: string, format: date-time, nullable: true}
    StartBulkFinalizeResponse:
      type: object
      required: [batch, bill_submission_locked, bill_submission_locked_at, captured_reviewed_count, captured_unreviewed_count]
      properties:
        batch: {$ref: "#/components/schemas/BulkFinalizeBatch"}
        bill_submission_locked: {type: boolean}
        bill_submission_locked_at: {type: string, format: date-time}
        captured_reviewed_count: {type: integer, description: Captured bills whose version was already reviewed}
        captured_unreviewed_count: {type: integer, description: Captured drafts that will be reviewed and finalized during processing}
    BatchDetailResponse:
      type: object
      required: [batch, items]
      properties:
        batch: {$ref: "#/components/schemas/BulkFinalizeBatch"}
        items: {type: array, items: {$ref: "#/components/schemas/BulkFinalizeItem"}}
        next_cursor: {type: string}
    CreateInviteRequest:
      type: object
      additionalProperties: false
      description: >-
        Any present field requires the active Captain. With an available invite and regenerate
        absent or false, that invite is reused unchanged. Values apply when creating a new invite.
      properties:
        expires_in_hours: {type: integer, minimum: 1, maximum: 168, description: Defaults to 24 when a new invite is created}
        max_uses: {type: integer, minimum: 1, maximum: 50, description: Unlimited when omitted for a new invite}
        regenerate: {type: boolean, description: True revokes every available invite first; false behaves like omission}
    Invite:
      type: object
      required: [id, code, invite_url, expires_at, max_uses, use_count]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, minLength: 8, maxLength: 8, pattern: '^[A-Za-z0-9]{8}$', description: Sensitive; only returned by active invite list or create/reuse}
        invite_url: {type: string, format: uri, description: HTTPS APP_INVITE_BASE_URL plus code as the final path segment}
        expires_at: {type: string, format: date-time}
        max_uses: {type: integer, nullable: true}
        use_count: {type: integer}
    InviteResponse:
      type: object
      required: [invite]
      properties:
        invite: {$ref: "#/components/schemas/Invite"}
    InviteListResponse:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items: {$ref: "#/components/schemas/Invite"}
    InvitePreview:
      type: object
      required: [group_name, active_member_count, captain_display_name]
      properties:
        group_name: {type: string}
        active_member_count: {type: integer}
        captain_display_name: {type: string}
    InvitePreviewResponse:
      type: object
      required: [preview]
      properties:
        preview: {$ref: "#/components/schemas/InvitePreview"}
    JoinGroupRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: {type: string, minLength: 8, maxLength: 8, pattern: '^[A-Za-z0-9]{8}$', description: Malformed values still receive INVITE_NOT_FOUND}
    JoinResult:
      type: object
      required: [group_id, membership_id, role, status, result]
      properties:
        group_id: {type: string, format: uuid}
        membership_id: {type: string, format: uuid}
        role: {type: string, enum: [captain, member]}
        status: {type: string, enum: [active, inactive]}
        result: {type: string, enum: [joined, reactivated, already_active]}
    JoinGroupResponse:
      type: object
      required: [join]
      properties:
        join: {$ref: "#/components/schemas/JoinResult"}
    TransferRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: {type: string, enum: [captain]}
    CaptainTransfer:
      type: object
      required: [previous_captain_member_id, current_captain_member_id]
      properties:
        previous_captain_member_id: {type: string, format: uuid}
        current_captain_member_id: {type: string, format: uuid}
    CaptainTransferResponse:
      type: object
      required: [transfer]
      properties:
        transfer: {$ref: "#/components/schemas/CaptainTransfer"}
    ActivityActor:
      type: object
      required: [member_id, user_id, display_name, avatar_url]
      properties:
        member_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        avatar_url: {type: string, format: uri, nullable: true}
    Activity:
      type: object
      required: [id, action_type, description, actor, metadata, created_at]
      properties:
        id: {type: string, format: uuid}
        action_type:
          type: string
          enum: [group_created, invite_created, invite_revoked, member_joined, member_reactivated, member_left, member_removed, captain_transferred, group_renamed, group_archived]
        description: {type: string}
        actor: {$ref: "#/components/schemas/ActivityActor"}
        metadata: {type: object, description: "Exact keys per action_type; never includes an invite code"}
        created_at: {type: string, format: date-time}
    ActivityListResponse:
      type: object
      required: [activities, next_cursor]
      properties:
        activities: {type: array, items: {$ref: "#/components/schemas/Activity"}}
        next_cursor: {type: string, nullable: true}
    Bank:
      type: object
      required: [name, code, bin, short_name, supported]
      properties:
        id: {type: integer, nullable: true}
        name: {type: string}
        code: {type: string}
        bin: {type: string}
        short_name: {type: string}
        logo: {type: string, format: uri, nullable: true}
        supported: {type: boolean}
    BankListResponse:
      type: object
      required: [banks]
      properties:
        banks: {type: array, items: {$ref: "#/components/schemas/Bank"}}

    Bill:
      type: object
      required: [id, group_id, creditor_member_id, status, subtotal, service_charge, vat, discount, total, version]
      properties:
        id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        creditor_member_id: {type: string, format: uuid}
        status: {type: string, enum: [draft, reviewed, finalized, voided]}
        merchant_name: {type: string, nullable: true}
        bill_date: {type: string, format: date-time, nullable: true}
        subtotal: {type: integer, format: int64}
        service_charge: {type: integer, format: int64}
        vat: {type: integer, format: int64}
        discount: {type: integer, format: int64, description: "Tổng giảm giá = total_item_discount + general_discount"}
        total_item_discount: {type: integer, format: int64, description: "Tổng khuyến mãi gắn theo từng món"}
        general_discount: {type: integer, format: int64, description: "Giảm giá chung/voucher của cả hóa đơn"}
        total: {type: integer, format: int64}
        split_method: {type: string, enum: [even, item_ratio, exact, shares, percentage]}
        mismatch_codes:
          type: array
          items:
            type: string
            enum: [OCR_DATE_AMBIGUOUS, LOW_CONFIDENCE, SUBTOTAL_MISMATCH, TOTAL_MISMATCH, ITEM_UNASSIGNED, INACTIVE_MEMBER_ASSIGNED, DISCOUNT_EXCEEDS_BILL, DISCOUNT_NOT_ALLOCATABLE, CREDITOR_REQUIRED]
          description: >-
            Stable blocker codes. On a bill detail read of a draft or reviewed bill these are
            recomputed at read time and merged with any stored OCR warnings, so the client learns
            why `breakdown` is absent instead of seeing an unexplained empty response. A non empty
            list means review and finalize will be refused until it clears.
        replaces_bill_id: {type: string, format: uuid, nullable: true}
        version: {type: integer}
        finalized_at: {type: string, format: date-time, nullable: true}
        voided_at: {type: string, format: date-time, nullable: true}
        reviewed_at: {type: string, format: date-time, nullable: true}
        reviewed_by_member_id: {type: string, format: uuid, nullable: true}
        images: {type: array, items: {$ref: "#/components/schemas/BillImage"}}
        items: {type: array, items: {$ref: "#/components/schemas/BillItem"}}
        shares: {type: array, items: {$ref: "#/components/schemas/BillShare"}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    BillStatusCounts:
      type: object
      description: >-
        Bill counts per status for the whole group. Never narrowed by the status
        filter of the request, so filter badges stay correct on every page.
      required: [draft, reviewed, finalized, voided, total]
      properties:
        draft: {type: integer, format: int64, minimum: 0}
        reviewed: {type: integer, format: int64, minimum: 0}
        finalized: {type: integer, format: int64, minimum: 0}
        voided: {type: integer, format: int64, minimum: 0}
        total: {type: integer, format: int64, minimum: 0}

    BillListItem:
      allOf:
        - $ref: "#/components/schemas/Bill"
        - type: object
          required: [payer_display_name, paid_member_count, member_count]
          properties:
            payer_display_name:
              type: string
              description: Current display name of the bill Creditor
            paid_member_count:
              type: integer
              format: int64
              minimum: 0
              description: >-
                Finalized shares already complete: the Creditor's own share, zero
                amount shares, and shares whose debt is settled or voided. A voided
                debt counts as complete because the debtor left the group and the
                amount was written off. Zero when progress is not applicable
            member_count:
              type: integer
              format: int64
              minimum: 0
              description: >-
                Immutable share count for a finalized bill, the Creditor included.
                Zero for draft, reviewed, and voided bills
            my_share:
              type: integer
              format: int64
              minimum: 0
              nullable: true
              description: >-
                Amount the caller owes for this bill, taken from the stored
                shares. Absent until the bill is finalized, and absent when the
                caller carries none of it
            my_share_status:
              type: string
              enum: [none, creditor, pending, settled]
              description: >-
                creditor when the caller paid up front, pending while they still
                owe the Creditor, settled once the debt is paid or was written
                off after they left the group, none when the bill is not
                finalized or the caller has no share
            ocr_status:
              type: string
              enum: [queued, processing, succeeded, failed]
              description: >-
                Status of the most recent OCR job, omitted for manually entered
                bills. Distinguishes a bill still being scanned from one waiting
                for item assignment - both are draft

    BillImage:
      type: object
      required: [id, bill_id, image_key, position]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        image_key: {type: string}
        position: {type: integer}
        created_at: {type: string, format: date-time}

    BillItem:
      type: object
      required: [id, bill_id, name, quantity, unit_price, line_total, position]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        name: {type: string}
        quantity: {type: string}
        unit_price: {type: integer, format: int64}
        line_total: {type: integer, format: int64}
        discount_amount: {type: integer, format: int64, description: "Khuyến mãi riêng cho món này (VND)"}
        final_price: {type: integer, format: int64, description: "line_total trừ discount_amount, dùng để chia cho thành viên"}
        position: {type: integer}
        assignments: {type: array, items: {$ref: "#/components/schemas/BillItemAssignment"}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    BillItemAssignment:
      type: object
      required: [id, bill_item_id, member_id, weight]
      properties:
        id: {type: string, format: uuid}
        bill_item_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        member_id: {type: string, format: uuid}
        weight: {type: string}
        created_at: {type: string, format: date-time}

    BillShare:
      type: object
      required: [id, bill_id, member_id, final_amount]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        member_id: {type: string, format: uuid}
        item_subtotal: {type: integer, format: int64, description: "Floor of the member exact item shares after aggregation across all participated items."}
        service_charge_share: {type: integer, format: int64}
        vat_share: {type: integer, format: int64}
        discount_share: {type: integer, format: int64}
        rounding_adjustment:
          type: integer
          format: int64
          description: >-
            final_amount minus item_subtotal, service_charge_share, and vat_share, plus discount_share.
            It records the exact reconciliation once and can belong to any member selected by the
            largest remainder rule. The Creditor has no rounding priority.
        final_amount: {type: integer, format: int64}
        created_at: {type: string, format: date-time}

    MemberAllocation:
      type: object
      required: [member_id, item_subtotal, service_charge_share, vat_share, discount_share, final_amount]
      properties:
        member_id: {type: string, format: uuid}
        item_subtotal: {type: integer, format: int64, description: "Floor of the member exact item shares after aggregation across all participated items."}
        service_charge_share: {type: integer, format: int64}
        vat_share: {type: integer, format: int64}
        discount_share: {type: integer, format: int64}
        rounding_adjustment:
          type: integer
          format: int64
          description: >-
            final_amount minus item_subtotal, service_charge_share, and vat_share, plus discount_share.
            It records the exact reconciliation once and can belong to any member selected by the
            largest remainder rule. The Creditor has no rounding priority.
        final_amount: {type: integer, format: int64}

    OCRJob:
      type: object
      required: [id, bill_id, status, provider, attempts, version]
      properties:
        id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, processing, succeeded, failed]}
        provider: {type: string}
        attempts: {type: integer}
        candidate: {type: object}
        error_message: {type: string, nullable: true}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}

    AccountSummary:
      type: object
      required: [id, email, display_name, phone_number, role, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        avatar_url: {type: string, format: uri}
        phone_number: {type: string}
        role: {type: string, enum: [user, admin]}
        status: {type: string, enum: [pending_verification, active, suspended, locked]}
        email_verified_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminPagination:
      type: object
      required: [total, page, limit, total_pages]
      properties:
        total: {type: integer, format: int64}
        page: {type: integer}
        limit: {type: integer}
        total_pages: {type: integer}
    ListAccountsResponse:
      type: object
      required: [items, pagination]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AccountSummary"}}
        pagination: {$ref: "#/components/schemas/AdminPagination"}
    AdminBankInfo:
      type: object
      properties:
        bank_code: {type: string, nullable: true}
        bank_account_number: {type: string, nullable: true}
        bank_account_holder: {type: string, nullable: true}
    AdminGroupMembership:
      type: object
      required: [group_id, group_name, role, status, joined_at]
      properties:
        group_id: {type: string, format: uuid}
        group_name: {type: string}
        role: {type: string, enum: [captain, member]}
        status: {type: string, enum: [active, inactive]}
        joined_at: {type: string, format: date-time}
    AdminFinancialSummary:
      type: object
      required: [outstanding_debts_count, total_debt_amount_vnd, outstanding_credits_count, total_credit_amount_vnd]
      properties:
        outstanding_debts_count: {type: integer, format: int64}
        total_debt_amount_vnd: {type: integer, format: int64}
        outstanding_credits_count: {type: integer, format: int64}
        total_credit_amount_vnd: {type: integer, format: int64}
    AdminAuditLog:
      type: object
      required: [id, admin_id, admin_email, target_user_id, action, reason, created_at]
      properties:
        id: {type: string, format: uuid}
        admin_id: {type: string, format: uuid}
        admin_email: {type: string, format: email}
        target_user_id: {type: string, format: uuid}
        action: {type: string}
        reason: {type: string}
        created_at: {type: string, format: date-time}
    AccountDetailResponse:
      type: object
      required: [id, email, display_name, phone_number, role, status, created_at, updated_at, failed_login_count, bank, active_sessions_count, groups, financials, recent_audit_logs]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        avatar_url: {type: string, format: uri}
        phone_number: {type: string}
        role: {type: string, enum: [user, admin]}
        status: {type: string, enum: [pending_verification, active, suspended, locked]}
        email_verified_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        failed_login_count: {type: integer}
        login_blocked_until: {type: string, format: date-time, nullable: true}
        bank: {$ref: "#/components/schemas/AdminBankInfo"}
        active_sessions_count: {type: integer, format: int64}
        groups: {type: array, items: {$ref: "#/components/schemas/AdminGroupMembership"}}
        financials: {$ref: "#/components/schemas/AdminFinancialSummary"}
        recent_audit_logs: {type: array, items: {$ref: "#/components/schemas/AdminAuditLog"}}
    UpdateStatusWarning:
      type: object
      required: [unsettled_debts_count, unsettled_credits_count]
      properties:
        unsettled_debts_count: {type: integer, format: int64}
        unsettled_credits_count: {type: integer, format: int64}
    UpdateStatusResponse:
      type: object
      required: [account, warning]
      properties:
        account: {$ref: "#/components/schemas/AccountSummary"}
        warning: {$ref: "#/components/schemas/UpdateStatusWarning"}
    SystemOverviewResponse:
      type: object
      required: [users, groups, bills, debts, media_cleanup, ocr_jobs, runtime]
      properties:
        users:
          type: object
          required: [total, active, pending_verification, suspended, locked]
          properties:
            total: {type: integer, format: int64}
            active: {type: integer, format: int64}
            pending_verification: {type: integer, format: int64}
            suspended: {type: integer, format: int64}
            locked: {type: integer, format: int64}
        groups:
          type: object
          required: [total]
          properties:
            total: {type: integer, format: int64}
        bills:
          type: object
          required: [total_finalized, total_draft]
          properties:
            total_finalized: {type: integer, format: int64}
            total_draft: {type: integer, format: int64}
        debts:
          type: object
          required: [awaiting, pending_confirmation, stalled_confirmation, rejected, settled]
          properties:
            awaiting: {type: integer, format: int64}
            pending_confirmation: {type: integer, format: int64}
            stalled_confirmation: {type: integer, format: int64}
            rejected: {type: integer, format: int64}
            settled: {type: integer, format: int64}
        media_cleanup:
          type: object
          required: [pending_jobs_count]
          properties:
            pending_jobs_count: {type: integer, format: int64}
        ocr_jobs:
          type: object
          required: [queued, processing, succeeded, failed]
          properties:
            queued: {type: integer, format: int64}
            processing: {type: integer, format: int64}
            succeeded: {type: integer, format: int64}
            failed: {type: integer, format: int64}
        runtime:
          type: object
          required: [goroutines_count, alloc_memory_bytes, uptime_seconds]
          properties:
            goroutines_count: {type: integer}
            alloc_memory_bytes: {type: integer, format: int64}
            uptime_seconds: {type: integer, format: int64}
