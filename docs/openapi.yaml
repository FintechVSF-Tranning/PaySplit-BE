openapi: 3.0.3
info:
  title: PaySplit Backend API
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Banks
  - name: Groups
  - name: Notifications
  - name: Bills
  - name: Admin
paths:
  /health:
    get:
      operationId: health
      tags: [Health]
      responses:
        "200": {description: Healthy}
  /api/v1/auth/sign-up:
    post:
      operationId: signUp
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignUpRequest"}
      responses:
        "201":
          description: Account created pending email verification
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/SignUpResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [Auth]
      requestBody: {$ref: "#/components/requestBodies/VerifyEmail"}
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties: {status: {type: string, enum: [active]}}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [Auth]
      requestBody: {$ref: "#/components/requestBodies/Email"}
      responses:
        "202": {$ref: "#/components/responses/EmailAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/sign-in:
    post:
      operationId: signIn
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignInRequest"}
      responses:
        "200":
          description: Signed in and prior device revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/SignInResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token, device_id]
              additionalProperties: false
              properties:
                refresh_token: {type: string, maxLength: 128}
                device_id: {type: string, format: uuid}
      responses:
        "200":
          description: Token pair rotated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/TokenPair"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [Auth]
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Session revoked}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [Auth]
      requestBody: {$ref: "#/components/requestBodies/Email"}
      responses:
        "202": {$ref: "#/components/responses/EmailAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, new_password]
              additionalProperties: false
              properties:
                email: {type: string, format: email, maxLength: 254}
                otp: {type: string, pattern: '^[0-9]{6}$', minLength: 6, maxLength: 6}
                new_password: {$ref: "#/components/schemas/Password"}
      responses:
        "204": {description: Password reset and all sessions revoked}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/users/me/events:
    get:
      summary: Stream signed in user events via Server-Sent Events
      description: |
        One session scoped user stream. Successful responses are text/event-stream
        and are not wrapped in SuccessEnvelope. Public frames are ready, roster,
        invalidate, ocr.updated, heartbeat, and close. The first public frame is
        always ready. Disabled servers return 404 (rollout off) or 501 (build
        without the user stream) so older apps can fall back to legacy group and
        bill streams. Clients treat both the same: fall back once, and only
        before the first `ready`.
      operationId: streamUserEvents
      tags: [Users]
      security: [{bearerAuth: []}]
      parameters:
        - name: X-App-Version
          in: header
          required: false
          schema: {type: string, example: "1.4.0+27"}
      responses:
        "200":
          description: SSE event stream
          headers:
            Cache-Control: {schema: {type: string, example: no-cache}}
            Connection: {schema: {type: string, example: keep-alive}}
            X-Accel-Buffering: {schema: {type: string, example: "no"}}
          content:
            text/event-stream:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: |
            User stream is disabled on this server. Clients fall back to the
            legacy group and bill streams.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500":
          description: Streaming is not supported by this server
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "501":
          description: |
            This build does not implement the user stream. Handled exactly like
            404 by clients.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "503":
          description: Realtime listener is unavailable
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/v1/users/me:
    get:
      operationId: getMyProfile
      tags: [Users]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Safe current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user]
                        properties: {user: {$ref: "#/components/schemas/User"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      operationId: patchMyProfile
      tags: [Users]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfilePatch"}
      responses:
        "200":
          description: Updated safe profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user]
                        properties: {user: {$ref: "#/components/schemas/User"}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/users/me/password:
    put:
      operationId: changeMyPassword
      tags: [Users]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: {type: string, maxLength: 72}
                new_password: {$ref: "#/components/schemas/Password"}
      responses:
        "204": {description: Password changed, current session retained}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/users/me/avatar:
    put:
      operationId: uploadMyAvatar
      tags: [Users]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              additionalProperties: false
              properties: {avatar: {type: string, format: binary}}
      responses:
        "200":
          description: WebP avatar stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [avatar_url]
                        properties: {avatar_url: {type: string, format: uri}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {$ref: "#/components/responses/BadRequest"}
        "502": {$ref: "#/components/responses/BadRequest"}
    delete:
      operationId: deleteMyAvatar
      tags: [Users]
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Avatar reference cleared}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/users/me/fcm-token:
    put:
      operationId: updateMyFCMToken
      tags: [Users]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token]
              additionalProperties: false
              properties:
                fcm_token: {type: string, minLength: 1}
      responses:
        "200":
          description: FCM token updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status: {type: string, enum: [ok]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/banks:
    get:
      operationId: listBanks
      tags: [Banks]
      summary: List supported and available banks
      description: Returns the list of banks from the VietQR snapshot directory.
      parameters:
        - name: supported
          in: query
          required: false
          schema:
            type: boolean
          description: Optional filter to return only supported (true) or unsupported (false) banks.
      responses:
        "200":
          description: List of banks
          headers:
            Cache-Control:
              schema: {type: string, example: "public, max-age=86400"}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/BankListResponse"}
  /api/v1/groups:
    post:
      operationId: createGroup
      tags: [Groups]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateGroupRequest"}
      responses:
        "201":
          description: Group created with the caller as its active Captain
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/CreateGroupResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    get:
      operationId: listGroups
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
          description: Opaque cursor from a prior response's next_cursor
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: Groups where the caller is an active member, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/GroupListResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/groups/{id}:
    get:
      operationId: getGroupDetail
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Group, active members, balances, and the caller's role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/GroupDetailResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: renameGroup
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RenameGroupRequest"}
      responses:
        "200":
          description: Group renamed and the activity committed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/GroupResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: disbandGroup
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Group archived without deleting financial or audit history}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: "GROUP_HAS_UNSETTLED_OBLIGATIONS when bills or debts remain, or BULK_FINALIZE_IN_PROGRESS with the safe active_batch_id while a bulk finalize batch is queued or processing (spec 0008 AC-7)"
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/GroupUnsettledObligationsError"}
                  - {$ref: "#/components/schemas/Error"}
  /api/v1/groups/{groupId}/bills/lock-submissions:
    post:
      summary: One way lock that stops new bill submission for the group (spec 0008)
      operationId: lockBillSubmissions
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: groupId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string}
          description: Optional; a repeated key with the same group replays the original 200 response.
      responses:
        "200":
          description: The group is locked now or was already locked; replay of an already locked group returns the same state without a new activity
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/LockSubmissionsResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/groups/{groupId}/bills/unlock-submissions:
    post:
      summary: Unlock bill submission for the group (allows new bills again)
      operationId: unlockBillSubmissions
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: groupId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Bill submission unlocked successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          bill_submission_locked: {type: boolean, example: false}
                          bill_submission_locked_at: {type: string, nullable: true, example: null}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/groups/{groupId}/bills/finalize-all:
    post:
      summary: Start one asynchronous bulk finalize batch over every open draft (spec 0008)
      description: >-
        Locks bill submission immediately inside the start transaction, captures every bill still in
        draft or reviewed status with its version and review state, then processes each captured bill
        independently through River. Returns 202 with the batch summary; read progress through the
        batch detail endpoint.
      operationId: startBulkFinalize
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: groupId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string}
          description: Optional; the same key with the same group returns the same batch, reuse for another group conflicts.
      responses:
        "202":
          description: Batch created (or replayed) and item jobs enqueued; zero-target batches complete immediately with both terminal times set
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/StartBulkFinalizeResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: "BULK_FINALIZE_IN_PROGRESS with the safe active_batch_id, or idempotency conflicts"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  /api/v1/groups/{groupId}/bill-finalize-batches/{batchId}:
    get:
      summary: Read a bulk finalize batch summary and one page of item results (spec 0008)
      operationId: getBillFinalizeBatch
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: groupId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: batchId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, default: 20, maximum: 100}
      responses:
        "200":
          description: Batch summary plus items ordered by (created_at, bill_id) ascending; a deleted bill keeps its stable failure code and a null display name
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/BatchDetailResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/groups/{id}/invites:
    get:
      operationId: listGroupInvites
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Available invites ordered by created_at and id descending
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/InviteListResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: createGroupInvite
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateInviteRequest"}
      responses:
        "201":
          description: A new invite was created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/InviteResponse"}
        "200":
          description: The group's one available invite was reused
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/InviteResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/groups/{id}/invites/{inviteId}:
    delete:
      operationId: revokeGroupInvite
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: inviteId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Invite revoked, idempotent on retry}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/groups/invites/{code}:
    get:
      operationId: previewGroupInvite
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: code
          in: path
          required: true
          schema: {type: string, minLength: 8, maxLength: 8, pattern: '^[A-Za-z0-9]{8}$'}
      responses:
        "200":
          description: Group name, active member count, and Captain display name
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/InvitePreviewResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/InviteNotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/groups/join:
    post:
      operationId: joinGroup
      tags: [Groups]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JoinGroupRequest"}
      responses:
        "200":
          description: Joined, reactivated, or already an active member
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/JoinGroupResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/InviteNotFound"}
        "409": {$ref: "#/components/responses/GroupMemberLimitReached"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/groups/{id}/members/{memberId}:
    delete:
      operationId: leaveOrRemoveMember
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: memberId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Membership marked inactive, idempotent on retry}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: Target has unsettled debts (GROUP_MEMBER_HAS_OPEN_DEBTS), or is the active Captain and must transfer the role first (CAPTAIN_TRANSFER_REQUIRED)
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/OpenDebtsError"}
                  - {$ref: "#/components/schemas/Error"}
  /api/v1/groups/{id}/members/{memberId}/role:
    put:
      operationId: transferCaptain
      tags: [Groups]
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: memberId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransferRoleRequest"}
      responses:
        "200":
          description: Captain role transferred to the target member
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/CaptainTransferResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CaptainRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The group lock for this transfer could not be acquired immediately
