services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: paysplit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paysplit"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - paysplit_postgres18_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-devpassword}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-devpassword} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - paysplit_redis_data:/data

volumes:
  paysplit_postgres_data:
  paysplit_postgres18_data:
  paysplit_redis_data:
